<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="yourtv-generation" content="2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشة تلفزيونك</title>
<style>
  @font-face{font-family:'Thmanyah';font-weight:300;font-style:normal;font-display:block;src:url("__F_LIGHT__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:400;font-style:normal;font-display:block;src:url("__F_REGULAR__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:500;font-style:normal;font-display:block;src:url("__F_MEDIUM__") format("woff2")}
  /* ﷺ and ﴿﴾ only (2 KB subset of Noto Naskh Arabic, OFL): Thmanyah has no glyph for them */
  @font-face{font-family:'NotoMarks';font-style:normal;font-weight:400;src:url("__F_MARKS__") format("woff2")}
  @font-face{font-family:'ThmanyahDisplay';font-weight:700;font-style:normal;font-display:block;src:url("__F_DISPLAY__") format("woff2")}

  :root{
    --sand:#F6EFE0;
    --dim:#C3B8A2;
    --gold:#DCB86F;
    --green-lt:#57D294;
    --red:#EE6A50;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* Hidden until the clock, the saved panels and the photo are in place, then one fade in: no half-built
     frames. The delayed animation shows it anyway if the script ever fails. */
  body{opacity:0;animation:reveal .3s 2.5s forwards}
  html.ready body{opacity:1;animation:none;transition:opacity .3s ease}
  @keyframes reveal{to{opacity:1}}
  /* card-only mode for the launcher */
  html.widget,html.widget body{background:transparent}
  html.widget .photo,html.widget .veil,html.widget .grain,html.widget .top-veil,html.widget .bottom-veil,
  html.widget .dimmer,html.widget #credit,html.widget .dots,html.widget .top,html.widget .clockwrap,html.widget .bottom{display:none}
  html.widget .stage{height:auto;padding:0;display:block;transition:none}
  html.widget .mid{display:block}
  html.widget .week{width:100%}
  html,body{
    height:100%;overflow:hidden;background:#040E09;color:var(--sand);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-family:'Thmanyah',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:none;
  }

  .photo{
    position:fixed;inset:0;z-index:0;
    background-image:none;
    background-color:#040E09;
    background-size:cover;
    background-position:center 26%;
    background-repeat:no-repeat;
    /* at rest exactly 1:1 (the photos are 1920×1080 like the screen): no resampling, every pixel sharp */
  }
  /* each photo's darkness as a plain black layer: same look as filter:brightness, nothing to recompute */
  .photo::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim,.05)}
  .veil{
    position:fixed;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(3,10,7,.62) 0%,rgba(3,10,7,.30) 22%,rgba(3,10,7,.12) 46%,rgba(3,10,7,.42) 74%,rgba(2,6,4,.88) 100%),
      radial-gradient(120% 85% at 22% 34%,rgba(3,14,9,.42) 0%,rgba(3,14,9,0) 58%);
  }
  /* the photo's description, small, under the bottom panels (full credits in docs/PHOTO-CREDITS.md) */
  #credit{
    position:fixed;left:3.6vw;bottom:1.1vh;z-index:6;text-align:left;direction:rtl;
    font-size:clamp(11px,.72vw,15px);font-weight:300;letter-spacing:.02em;
    color:rgba(246,239,224,.55);pointer-events:none;white-space:nowrap;
  }
  #credit:empty{display:none}
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.022;   /* just enough to break gradient banding */
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .top-veil{
    position:fixed;left:0;top:0;width:56vw;height:34vh;z-index:3;pointer-events:none;
    background:radial-gradient(120% 100% at 0% 0%,rgba(2,9,6,.82) 0%,rgba(2,9,6,.42) 45%,rgba(2,9,6,0) 76%);
  }
  .bottom-veil{
    position:fixed;left:0;right:0;bottom:0;height:30vh;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(2,7,4,0) 0%,rgba(2,7,4,.55) 42%,rgba(2,6,4,.86) 100%);
  }

  .stage{
    position:relative;z-index:5;height:100vh;
    padding:3.1vh 3.6vw 5.4vh;
    display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;
  }

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2.5vw}

  .up{color:var(--green-lt)}.down{color:var(--red)}

  .week{
    width:min(760px,48vw);justify-self:end;
    background:rgba(4,14,9,.60);   /* no backdrop blur: over a moving photo it is redone every frame */
    border:1px solid rgba(220,184,111,.16);
    border-radius:12px;
    padding:1.7vh 1.4vw;
  }
  .week .hd{
    display:flex;align-items:center;gap:.7em;margin-bottom:1vh;
    font-size:clamp(12px,1vw,18px);font-weight:500;letter-spacing:.18em;color:#D6AF6B;
  }
  .week .hd .hd-ic svg{width:1.45em;height:1.45em;display:block}
  .week .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(220,184,111,.5),transparent)}
  .week ul{list-style:none;display:flex;flex-direction:column;gap:0}
  .week li{
    display:flex;align-items:baseline;gap:1.05em;
    font-size:clamp(14px,1.16vw,22px);font-weight:400;color:#F6EEDC;
    white-space:nowrap;line-height:1.3;
    padding:.8vh 0;border-bottom:1px solid rgba(220,184,111,.13);
  }
  .week li:last-child{border-bottom:none}
  .week li span:first-child{flex:0 1 auto;max-width:68%;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li .ep{flex:0 0 auto;color:#9FB8A8;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .rt{flex:0 0 auto;color:#E0BA74;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .dt{flex:1 1 auto;color:#9C9279;font-size:.72em;min-width:3.2em;text-align:left}
  .week ul.flip li{animation:weekIn .5s ease both}
  .week ul.flip li:nth-child(2){animation-delay:.06s}
  .week ul.flip li:nth-child(3){animation-delay:.12s}
  .week ul.flip li:nth-child(4){animation-delay:.18s}
  .week ul.flip li:nth-child(5){animation-delay:.24s}
  @keyframes weekIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .week li.past{color:#8F8670}
  .week li.next{color:#FFE9B8}
  .week li.next .dt{color:#E0BA74}
  .week li.quote{white-space:normal;display:block;font-size:clamp(17px,1.5vw,29px);line-height:1.75;
    border-bottom:none;padding:.4vh 0 0;color:#FFF7E6}
  /* Thmanyah draws ﴿﴾ as small angle marks: they come from the NotoMarks subset */
  .week li.quote .orn{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;
    font-size:1.05em;padding:0 .15em}
  /* ﷺ is not in Thmanyah either: NotoMarks, in gold like the verse brackets so it reads as ornament */
  .week li.quote .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;font-size:1.6em;line-height:1;vertical-align:-.1em}
  /* a full hadith: the isnad and the narration small and muted, the Prophet's words ﷺ at full size */
  .week li.quote.hadith{font-size:clamp(15px,1.3vw,25px);line-height:1.7}
  .week li.quote .nar{font-size:.66em;color:#B9AE96}
  .week li.quote .nar .saw{font-size:1.45em}
  .week li.src{border-bottom:none;padding:.6vh 0 0;font-size:clamp(12px,.95vw,18px);color:#D6AF6B}
  .week .empty{color:#9A9078;font-size:clamp(14px,1.1vw,21px);font-weight:300;margin-top:1vh}

  .dates{text-align:right;flex-shrink:0}
  .hijri{font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand);line-height:1.3}
  .greg{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim)}
  /* starts at the screen edge, under the first letters, and fades toward the middle */
  .rule{margin-top:1.2vh;width:clamp(100px,9vw,190px);height:1px;margin-left:auto;margin-right:0;
    background:linear-gradient(270deg,var(--gold),rgba(220,184,111,0))}

  /* the card keeps its width on the left; the clock is centred in the space between it and the right edge */
  .mid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4.5vw}
  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-self:center}
  .clock{
    display:flex;align-items:baseline;justify-content:center;direction:ltr;
    font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-weight:700;
    font-size:clamp(120px,min(17vw,31vh),345px);line-height:.92;letter-spacing:.022em;
    color:#FFFDF6;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 70px rgba(0,0,0,.65), 0 0 130px rgba(255,236,190,.12);
  }
  .clock .d{unicode-bidi:isolate}
  .clock .d i{font-style:normal}
  .clock .d i + i{margin-left:var(--digit-gap,.09em)}
  .clock .sep{
    font-size:.46em;align-self:center;transform:translateY(-.08em);color:var(--gold);opacity:.9;padding:0 .1em;
  }
  .clock .ampm{
    font-size:.28em;font-weight:500;color:var(--gold);
    align-self:flex-start;margin-top:.12em;margin-inline-end:.25em;
  }
  .subline{
    margin-top:1.4vh;display:flex;align-items:center;gap:.7em;
    font-size:clamp(12px,1.02vw,20px);font-weight:300;letter-spacing:.3em;color:#D8CDB6;
  }
  .subline .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.9}

  .bottom{
    display:grid;grid-template-columns:.9fr .8fr 1.6fr;
    gap:2.4vw;align-items:start;
    border-top:1px solid rgba(220,184,111,.30);
    padding-top:2.1vh;
  }
  .panel{min-width:0}
  .panel .label{
    font-size:clamp(12px,.98vw,18px);font-weight:500;letter-spacing:.2em;
    color:#D6AF6B;margin-bottom:.8vh;white-space:nowrap;
  }
  .panel .big{
    display:flex;align-items:baseline;gap:.4em;flex-wrap:nowrap;white-space:nowrap;min-width:0;line-height:1.1;
    font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(22px,2vw,42px);color:var(--sand);
  }
  .panel .num{color:#FFFCF2;font-size:1.12em;font-variant-numeric:tabular-nums;font-weight:500}
  .panel .unit{font-size:.56em;font-weight:500;color:var(--gold)}
  .panel .sub{
    margin-top:.85vh;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em;
  }
  .panel .sub b{color:#F0E6D0;font-weight:500}

  .p-prayer{text-align:right}
  .p-prayer .big{justify-content:flex-start}
  .p-mid{text-align:center}
  .p-mid .big{display:block;text-align:center;line-height:1.06}
  .p-mid .num{font-size:1.3em;line-height:1}
  .p-mid .unit{font-size:.46em;font-weight:500;color:#D6AF6B;letter-spacing:.02em;display:inline;vertical-align:.5em}
  .p-match{text-align:left}
  .p-match .big{justify-content:flex-end}
  .p-match .sub{white-space:normal;line-height:1.4;max-width:100%;font-size:clamp(11px,.88vw,17px)}

  .mrow{display:flex;flex-direction:row;gap:1.6vw;align-items:flex-end;justify-content:flex-end;min-width:0}
  .mblock{text-align:left;flex:0 1 auto;min-width:0;max-width:100%}
  .mblock:not(:last-child){padding-inline-end:1.6vw;border-inline-end:1px solid rgba(220,184,111,.25)}
  .mrow:has(.mblock + .mblock) .big{font-size:clamp(16px,1.32vw,28px)}
  .mrow .crest{margin:0 .15em}
  .mblock .big{justify-content:flex-end;min-width:0}
  .mrow.flip .mblock{animation:weekIn .5s ease both}
  .mrow.flip .mblock + .mblock{animation-delay:.08s}
  .mblock .big > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
    padding-bottom:.3em;margin-bottom:-.3em}  /* room for the dots under ي, ج… */
  .none-week{font-size:clamp(26px,2.5vw,54px);font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;color:#A79C85}

  /* A new photo settles in over a minute, then holds still: an endless drift kept the TV redrawing
     the whole screen 60 times a second, for hours. */
  @keyframes settle{
    from{transform:scale(1.025) translate3d(-.4%,-.3%,0)}
    to{transform:none}
  }
  @media (prefers-reduced-motion:no-preference){.photo.settle{animation:settle 60s ease-out both}}

  /* ===== top left: weather and markets, set like the date block on the right (no boxes) ===== */
  .markets{text-align:left;flex-shrink:0}
  .wxline{display:flex;align-items:baseline;gap:.5em;justify-content:flex-end;line-height:1.3;
    font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand)}
  .wxt{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;color:#FFFCF2;direction:ltr;
    font-variant-numeric:tabular-nums}
  .wxd.dust{color:#E8B86A}
  .wxsub{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim);white-space:nowrap}
  .wxr:not(:empty)::before{content:'  ·  ';white-space:pre;color:rgba(214,175,107,.7)}
  .wxt:empty,.wxd:empty,.wxr:empty{display:none}
  .rule.l{margin-left:0;margin-right:auto;background:linear-gradient(90deg,var(--gold),rgba(220,184,111,0))}
  /* today's five prayers where the markets were: past ones dim, the next one gold with the time left */
  .pt{margin-top:1.2vh;display:flex;justify-content:flex-end;gap:1.3em;white-space:nowrap;direction:rtl;
    font-size:clamp(12px,1.06vw,21px);font-weight:400;color:#D8CDB6}
  .pt .q{display:flex;flex-direction:column;align-items:center;gap:.15em;line-height:1.25}
  .pt .q .n{font-size:.82em;color:#C6BBA4}
  .pt .q .t{font-variant-numeric:tabular-nums}
  .pt .q.past{opacity:.5}
  .pt .q.next{opacity:1;padding:.25em .7em;margin:-.25em -.2em;border-radius:10px;
    background:rgba(220,184,111,.22);border:1.5px solid rgba(232,196,111,.9);box-shadow:0 0 22px rgba(220,184,111,.25)}
  .pt .q.next .n,.pt .q.next .t{color:#FFE7AE;font-weight:600}
  .pt-left{margin-top:.7vh;text-align:left;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;white-space:nowrap}
  .pt-left b{color:#F1CF8A;font-weight:500}
  .p-mid .greet{font-size:.8em;color:#FFE2A6}
  .p-mid .cd{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
  .pt .q.aux .n,.pt .q.aux .t{color:#A9B4C2}
  .pt .q.aux .n{font-size:.74em}
  /* the card: each one slides in from above and leaves downward, slowly; dots beside it show which one */
  .week{position:relative}
  .wbody{transition:transform 1.1s cubic-bezier(.4,0,.2,1),opacity 1.1s ease}
  .wbody.out{transform:translateY(-5vh);opacity:0}
  .wbody.pre{transform:translateY(5vh);opacity:0;transition:none}
  .dots{position:absolute;left:-1.6vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.9vh}
  .dots i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(246,239,224,.28);transition:all .6s ease}
  .dots i.on{background:var(--gold);height:20px;border-radius:4px}
  .week li.quote .who{color:#D6AF6B}
  .week li.quote.verse2{text-align:center;line-height:2}
  .week li.bio{border-bottom:none;padding:.3vh 0 0;font-size:clamp(11px,.85vw,16px);color:#B9AE96;white-space:normal}
  /* weather card: icon per day, high and low under their own headings, today stands out */
  .wx-ic{width:1.35em;height:1.35em;flex:0 0 auto;vertical-align:-.3em}
  .week li.fc{align-items:center}
  .week li.fc .fd{flex:0 0 4.6em}
  .week li.fc .fx{flex:1 1 auto;display:flex;align-items:center;gap:.5em;color:#D8CDB6;font-size:.86em}
  .week li.fc .hi,.week li.fc .lo{flex:0 0 3.2em;text-align:center;font-variant-numeric:tabular-nums}
  .week li.fc .lo{color:#9FB8C8}
  .week li.fh{padding:.2vh 0 .5vh;font-size:clamp(11px,.85vw,16px);color:#B9AE96;border-bottom:1px solid rgba(220,184,111,.25)}
  .week li.fh .fx{flex:1 1 auto}
  .week li.fc.today{background:rgba(220,184,111,.14);border:1px solid rgba(220,184,111,.45);border-radius:10px;
    padding-left:.6em;padding-right:.6em;margin:.3vh -.6em;color:#FFF3D6}
  .week li.fc.today .fd{color:#FFE2A6;font-weight:500}
  .wxline .wx-ic{width:1.1em;height:1.1em;align-self:center}
  /* club crests beside the names */
  .crest{width:1.05em;height:1.05em;object-fit:contain;vertical-align:-.18em;margin:0 .22em}
  /* 24-hour time and the day/night sign under the clock */
  .subline .h24{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;letter-spacing:.08em;color:#C6BBA4}
  .subline .mode{display:inline-flex;align-items:center;gap:.35em;letter-spacing:.1em}
  .subline .mode svg{width:1.25em;height:1.25em}
  /* night: cooler and quieter than the day */
  html.night{--gold:#C9B98F;--sand:#E6E1D6;--dim:#A9A79C}
  html.night .veil{background:
      linear-gradient(180deg,rgba(2,6,14,.72) 0%,rgba(2,6,14,.42) 22%,rgba(2,6,14,.26) 46%,rgba(2,6,14,.55) 74%,rgba(1,3,8,.92) 100%)}
  html.night .clock{color:#EEF1F6;text-shadow:0 4px 70px rgba(0,0,0,.75),0 0 120px rgba(170,190,230,.10)}
  html.night .week{background:rgba(4,10,20,.62);border-color:rgba(170,190,230,.18)}
  .veil,.clock,.week{transition:background 4s ease,color 4s ease,border-color 4s ease}
  /* a message from the phone: large, centred, over everything */
  .msgbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;display:none;align-items:center;gap:1.4vw;
    max-width:70vw;padding:3vh 3vw;border-radius:22px;background:rgba(8,20,14,.92);border:2px solid rgba(232,196,111,.85);
    box-shadow:0 0 80px rgba(0,0,0,.6)}
  .msgbox.on{display:flex}
  .msgbox[data-kind="welcome"]{border-color:rgba(127,207,156,.9)}
  .msgbox[data-kind="urgent"]{border-color:rgba(240,106,90,.95);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 90px rgba(240,106,90,.45)}}
  .msgbox .m-ic{font-size:clamp(34px,3vw,64px)}
  .msgbox .m-tx{font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(34px,3.6vw,76px);line-height:1.25;color:#FFF3D6}
  .al.rem{border-color:#C9A0F0;background:rgba(170,120,240,.2);color:#F1E6FF}
  .week li.task{display:flex;justify-content:space-between;align-items:baseline}
  .week li.task.late{color:#FFC9BE}
  .week li.task.late .dt{color:#EE8B70}
  .week li.task.rem.now{color:#F1E6FF;font-weight:500}
  .week li.task.rem.now .dt{color:#C9A0F0}
  .week li.task.rem.past{opacity:.5}
  html.qtop .week{margin-top:7vh;height:41vh}
  /* sleep mode: the clock and the date only, dimmed */
  html.sleep .markets,html.sleep .week,html.sleep .bottom,html.sleep .alerts,html.sleep #credit,html.sleep .subline{display:none}
  html.sleep .msgbox.on{display:flex}
  html.sleep .photo{filter:brightness(.35)}
  html.sleep .clock{opacity:.55}
  html.sleep .dates{opacity:.6}
  html.sleep .mid{grid-template-columns:1fr}
  /* alerts under the clock: prayer, Friday, fasting, matches, weather */
  .alerts{margin-top:1.8vh;display:flex;flex-wrap:wrap;justify-content:center;gap:.7vh .6vw;max-width:44vw}
  .alerts:empty{display:none}
  .al{display:inline-flex;align-items:center;gap:.45em;padding:.38em .95em;border-radius:999px;white-space:nowrap;
    font-size:clamp(13px,1.05vw,20px);font-weight:500;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.3);color:#F6EEDC}
  .al svg{width:1.25em;height:1.25em;flex:0 0 auto}
  .al small{font-weight:400;opacity:.85;font-size:.82em}
  .al .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;font-size:1.35em;line-height:1;color:#F3D48A}
  .al.prayer{border-color:#E8C46F;background:rgba(220,184,111,.22);color:#FFE7AE}
  .al.fri{border-color:#7FCF9C;background:rgba(87,210,148,.16);color:#D9F5E4}
  .al.fast{border-color:#8ED1D6;background:rgba(110,200,210,.16);color:#DDF4F6}
  .al.match{border-color:#9DB8F0;background:rgba(120,160,240,.16);color:#E2EBFD}
  .al.live{border-color:#F08A70;background:rgba(238,106,80,.24);color:#FFE1D8}
  .al.w1{border-color:#F2D46B;background:rgba(242,212,107,.18);color:#FFF2C4}
  .al.w2{border-color:#F2A24B;background:rgba(242,162,75,.22);color:#FFE2C2}
  .al.w3{border-color:#F06A5A;background:rgba(240,106,90,.28);color:#FFD9D3}
  /* the adhan: a large panel over the card for its first minutes */
  .adhan{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;
    border-radius:12px;background:rgba(6,18,12,.94);border:1px solid rgba(220,184,111,.6);text-align:center}
  .adhan.on{display:flex}
  .adhan .a1{font-size:clamp(18px,1.5vw,30px);color:#D6AF6B;letter-spacing:.1em}
  .adhan .a2{font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(40px,4.2vw,84px);color:#FFF3D6;line-height:1.1}
  .adhan .a3{font-size:clamp(15px,1.2vw,24px);color:#C6BBA4}
  /* one card size for every card: the content is centred in it and shrinks only if it would not fit */
  .week{height:46vh;display:flex;flex-direction:column}
  html.widget .week{height:auto}
  .wbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #week-list{flex:1 1 auto;min-height:0;justify-content:center;overflow:hidden}
  /* weather: today large, the next days small under it */
  .week li.wx-hero{display:flex;align-items:center;gap:1.4vw;border-bottom:none;padding:1vh 0 1.6vh;white-space:nowrap}
  .wx-hero .big-ic svg{width:clamp(56px,5.2vw,104px);height:clamp(56px,5.2vw,104px)}
  .wx-today{display:flex;flex-direction:column;gap:.3vh;flex:1 1 auto}
  .wx-today b{font-size:1.5em;color:#FFF3D6;font-weight:500}
  .wx-today span{color:#D8CDB6}
  .wx-hl{display:flex;gap:1.6vw;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:2.1em;color:#FFFCF2}
  .wx-hl > span{display:flex;flex-direction:column;align-items:center;line-height:1.05}
  .wx-hl .lo{color:#9FC3DA}
  .wx-hl small{font-family:'Thmanyah',sans-serif;font-size:.36em;color:#C6BBA4;margin-bottom:.4vh}
  .week li.wx-days{display:grid;grid-template-columns:repeat(4,1fr);gap:.6vw;border-top:1px solid rgba(220,184,111,.25);
    border-bottom:none;padding-top:1.4vh;white-space:nowrap}
  .wx-d{display:flex;flex-direction:column;align-items:center;gap:.5vh;font-size:.8em;color:#C6BBA4}
  .wx-d b{font-weight:400;color:#E8DFC9}
  .wx-d svg{width:1.6em;height:1.6em}
  .wx-d i{font-style:normal;opacity:.5}
  /* matches: home on the right, the score or kick-off in the middle, away on the left */
  .week li.mh{border-bottom:none;padding:.5vh 0 .1vh;font-size:.7em;letter-spacing:.15em;color:#D6AF6B}
  .week li.m3{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;align-items:center;
    column-gap:1vw;row-gap:.1vh;padding:.55vh 0}
  .week li.m3 > span{max-width:none;padding:0;margin:0}
  .m3 .tt,.m3 .mid{grid-row:1}
  .m3 > .st{grid-row:2;grid-column:2;text-align:center}
  .m3 .tt{display:flex;align-items:center;gap:.4em;min-width:0;overflow:hidden}
  .m3 .tt span{overflow:hidden;text-overflow:ellipsis}
  .m3 .tt.a{justify-content:flex-end}
  .m3 .tt .crest{width:1.35em;height:1.35em;margin:0}
  .m3 .tt.win{color:#FFFFFF;font-weight:500}
  .m3 .tt.lose{opacity:.5}
  .mblock .wn{color:#FFFFFF}
  .mblock .ls{opacity:.5}
  .m3 .mid{display:flex;justify-content:center;min-width:5.2em}
  .m3 .sc2{direction:ltr;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:1.2em;color:#FFE2A6;
    background:rgba(220,184,111,.12);border:1px solid rgba(220,184,111,.35);border-radius:8px;padding:0 .55em}
  .m3 .sc2 i{font-style:normal;opacity:.6}
  .m3 .tm{color:#F6EEDC;font-variant-numeric:tabular-nums}
  .m3 .st{font-size:.62em;color:#9C9279;margin-top:.2vh}
  .m3 .st.live{color:#EE8B70;font-weight:500}
  /* the home screen's card */
  .week li.hm1{display:flex;align-items:baseline;justify-content:space-between;border-bottom:none;padding:.4vh 0;
    font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:1.6em;color:#FFF3D6}
  .week li.hm1 small{font-family:'Thmanyah',sans-serif;font-size:.5em;color:#E0BA74}
  .week li.hm2{display:flex;justify-content:space-between;gap:.6em;font-size:.78em;color:#C6BBA4;padding:.8vh 0}
  .week li.hm2 span{display:flex;flex-direction:column;align-items:center}
  .week li.hm2 b{font-weight:400;font-size:.85em}
  .week li.hm2 .on{color:#FFE2A6}
  .week li.hm3{border-bottom:none;padding-top:.8vh;font-size:.85em;color:#D6AF6B}
  /* the month's number, small and gold, joined to its name */
  .mchip{display:inline-block;unicode-bidi:isolate;font-size:.6em;line-height:1.35;color:var(--gold);
    border:1px solid rgba(220,184,111,.7);border-radius:6px;padding:0 .45em;margin:0 .15em;vertical-align:.22em}
  /* occasions: «متبقي» small before the number */
  .p-mid .sub{white-space:normal;overflow:visible;display:flex;flex-direction:column;gap:.35vh;line-height:1.35}
  .p-mid .sub .d1,.p-mid .sub .d2{white-space:nowrap}
  .p-mid .sub .d2{color:#D6AF6B}
  .p-mid .left{font-family:'Thmanyah',sans-serif;font-size:.42em;font-weight:400;color:#C6BBA4;vertical-align:.35em}
  /* day / night: a clear badge under the clock */
  .subline .mode{padding:.3em .85em;border-radius:999px;background:rgba(243,201,105,.16);border:1px solid rgba(243,201,105,.55);
    color:#FFE7AE;letter-spacing:.05em;font-size:1.15em}
  .subline .mode b{font-weight:500}
  .subline .mode svg{width:1.4em;height:1.4em}
  .subline .mode.n{background:rgba(190,205,235,.14);border-color:rgba(190,205,235,.5);color:#E4ECFA}
  .p-prayer.now .big{color:#FFE9B8;text-shadow:0 0 40px rgba(220,184,111,.45)}
  .p-prayer.now .label{color:#F1CF8A}
  .live{color:#EE8B70;font-weight:500}
  .dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity 6s linear}
  .stage{transition:transform 3s ease}
  .sc{color:#E0BA74;letter-spacing:.02em}

  /* ===== v4: clearer titles, the clock's line, family panel, icons, smooth changes ===== */
  .week .hd{font-size:clamp(16px,1.5vw,30px);letter-spacing:.04em;color:#F1CF8A;margin-bottom:1.3vh;gap:.6em}
  .week .hd .hd-ic svg{width:1.25em;height:1.25em}
  .pt .q .t small{font-size:.68em;margin-inline-start:.22em;opacity:.8}
  .subline{gap:.7vw;letter-spacing:normal;margin-top:1.8vh}
  .subline .chip{display:inline-flex;align-items:center;gap:.45em;padding:.32em .95em;border-radius:999px;white-space:nowrap;
    font-size:clamp(13px,1.08vw,21px);font-weight:400;letter-spacing:.02em;color:#E8DFC9;
    background:rgba(0,0,0,.30);border:1px solid rgba(220,184,111,.38)}
  .subline .chip svg{width:1.3em;height:1.3em}
  .subline .chip.h24 b{font-weight:500;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;color:#FFF3D6;letter-spacing:.06em}
  .subline .chip.h24 small{font-size:.74em;color:#B9AE96}
  .subline .chip.city{color:#F3E9D2}
  /* a ghost of the old content fades out while the new one fades in: no blank moment */
  .xf-ghost{pointer-events:none;z-index:2;transition:opacity .9s ease,transform .9s ease}
  .xf-ghost.xf-gone{opacity:0;transform:translateY(-1.4vh)}
  .xf-in{animation:xfIn 1.1s cubic-bezier(.22,.61,.36,1) both}
  @keyframes xfIn{from{opacity:0;transform:translateY(1.6vh)}to{opacity:1;transform:none}}
  .bottom,.p-match,.p-mid{position:relative}
  /* family occasions: their own panel */
  .bottom.fam{grid-template-columns:.85fr .78fr .78fr 1.45fr;gap:1.8vw}
  .p-fam{display:none}
  .bottom.fam .p-fam{display:grid}
  .bottom.fam .p-mid .big{font-size:clamp(20px,1.8vw,38px)}
  .occ-ic{display:inline-flex;vertical-align:-.32em;margin-inline-end:.4em}
  .occ-ic svg{width:1.55em;height:1.55em}
  .occ-ic.travel svg{animation:fly 6s ease-in-out infinite}
  @keyframes fly{0%,100%{transform:none}50%{transform:translate(-4px,-3px) rotate(-6deg)}}
  .p-mid .label{letter-spacing:.06em;font-size:clamp(13px,1.05vw,20px);color:#F1CF8A}
  /* live countdowns (tasks, reminders, bedtime, games) */
  .cdn{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;color:#F1CF8A;font-weight:500}
  .week li.task .dt{display:flex;flex-direction:column;align-items:flex-end;gap:.1em;font-size:.8em}
  .week li.task .dt small{font-size:.8em;color:#9C9279}
  /* my series */
  .week li.sr{display:flex;flex-direction:column;align-items:stretch;gap:.25vh;white-space:normal;padding:.7vh 0}
  .week li.sr .sn{display:flex;justify-content:space-between;align-items:baseline;gap:.6em;max-width:none;overflow:visible;padding:0;margin:0}
  .week li.sr .sn b{font-weight:500;color:#FFF3D6}
  .week li.sr .ss{font-size:.78em;color:#C6BBA4}
  .week li.sr .new{color:#7FE0A8;font-weight:500}
  .week li.sr .tag{font-size:.7em;padding:.05em .6em;border-radius:999px;background:rgba(87,210,148,.18);border:1px solid rgba(127,224,168,.6);color:#BFF2D3}
  /* bedtime */
  .week li.bt1{display:flex;flex-direction:column;align-items:center;gap:.6vh;border-bottom:none;padding:1.4vh 0}
  .week li.bt1 .cdn{font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:2.6em;color:#E4ECFA;font-weight:700}
  .week li.bt1 span{color:#C6BBA4}
  .week li.bt2{display:flex;justify-content:space-between;font-size:.74em;color:#9C9279;border-top:1px solid rgba(220,184,111,.25);border-bottom:none;padding-top:1.2vh}
  .week li.bt2 span{display:flex;flex-direction:column;align-items:center;gap:.2em}
  .week li.bt2 .on{color:#E4ECFA;font-weight:500}
  .al.sleepy{border-color:#AFC2EE;background:rgba(150,175,235,.18);color:#E6EDFC}
  .al.game{border-color:#C79BF2;background:rgba(170,120,240,.2);color:#F1E6FF}
  .al.series{border-color:#7FE0A8;background:rgba(87,210,148,.16);color:#D9F5E4}

  /* the morning summary */
  .week li.sm{display:grid;grid-template-columns:5.2em 1fr;align-items:center;gap:.8em;white-space:normal;padding:.75vh 0}
  .week li.sm .k{display:flex;align-items:center;gap:.4em;color:#E0BA74;font-size:.82em;max-width:none;overflow:visible;padding:0;margin:0}
  .week li.sm .k svg{width:1.35em;height:1.35em}
  .week li.sm .v{color:#F6EEDC;font-size:.92em;line-height:1.45}
  .week li.sm .v small{color:#B9AE96;font-size:.82em}
  /* the kick-off panel over the card */
  .kick{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.8vh;
    border-radius:12px;background:rgba(6,16,26,.95);border:1px solid rgba(157,195,240,.7);text-align:center}
  .kick.on{display:flex}
  .kick .k1{font-size:clamp(18px,1.5vw,30px);color:#9DC3F0;letter-spacing:.08em}
  .kick .k2{display:flex;align-items:center;gap:1.4vw;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(30px,2.8vw,58px);color:#FFF3D6}
  .kick .k2 img{width:1.5em;height:1.5em;object-fit:contain}
  .kick .k2 i{font-style:normal;color:#9DC3F0;font-size:.7em}
  .kick .k3{font-size:clamp(15px,1.25vw,25px);color:#D8CDB6}
  .kick .k3 b{color:#FFE2A6;font-weight:500}
  /* the daily wird */
  .week li.quote.wird{font-size:clamp(17px,1.45vw,28px);line-height:2;text-align:justify}
  .week li.quote.wird .an{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;font-size:.85em;padding:0 .2em}
  .week li.sh{display:block;text-align:center;border-bottom:none;padding:.3vh 0;color:#E0BA74;font-size:.9em}
  .week li.wp{display:flex;align-items:center;gap:.8em;border-bottom:none;padding:.8vh 0 0;font-size:.72em;color:#B9AE96}
  .week li.wp .bar{flex:1;height:6px;border-radius:3px;background:rgba(246,239,224,.14);overflow:hidden}
  .week li.wp .bar i{display:block;height:100%;background:linear-gradient(90deg,#DCB86F,#F3D48A);border-radius:3px}
  .week li.wd{display:flex;flex-direction:column;align-items:center;gap:1vh;border-bottom:none;padding:2vh 0}
  .week li.wd b{font-size:1.6em;color:#BFF2D3;font-weight:500}
  .al.wird{border-color:#DCB86F;background:rgba(220,184,111,.16);color:#FFE7AE}

  /* whose screen: above the clock */
  .who{display:none;align-items:center;gap:.5em;margin-bottom:1.4vh;padding:.3em 1.1em;border-radius:999px;
    font-size:clamp(14px,1.2vw,24px);color:#FFF3D6;background:rgba(0,0,0,.32);border:1px solid rgba(220,184,111,.45)}
  .who.on{display:inline-flex}
  .who .st{color:#F3D48A}
  .clockwrap .who{align-self:center}
  /* the 24-hour time: a small clock instead of the words */
  .subline .chip.h24 svg{width:1.15em;height:1.15em;opacity:.85}
  /* the official logos: Founding Day, and the Kingdom's emblem for National Day */
  /* the label keeps one height whatever its icon: a logo overflows it, it never pushes the panel down */
  .p-mid .label{height:1.6em;display:flex;align-items:center;justify-content:center;overflow:visible;white-space:nowrap}
  .occ-ic.logo{height:1.6em;display:inline-flex;align-items:center}
  .occ-ic.logo img{height:2.1em;width:auto;display:block}
  .occ-ic.logo.founding img{height:2.9em;margin-top:-.4em}
  /* a child's stars */
  .week li.stars{display:flex;flex-direction:column;align-items:center;gap:1.2vh;border-bottom:none;padding:1.6vh 0}
  .week li.stars .n{font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:3.2em;color:#F3D48A;line-height:1}
  .week li.stars .row{font-size:1.5em;letter-spacing:.1em;white-space:normal;text-align:center}
  .week li.guest{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;border-bottom:none;padding:3vh 0;text-align:center;white-space:normal}
  .week li.guest b{font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:2.6em;color:#FFF3D6;font-weight:700;line-height:1.2}
  .week li.guest span{color:#D8CDB6;font-size:1.1em}

  /* my series and films: posters */
  .week li.posters{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3vw;border-bottom:none;padding:.4vh 0;white-space:normal}
  .pc{display:flex;flex-direction:column;align-items:center;gap:.7vh;min-width:0;text-align:center}
  .pimg{position:relative;height:23vh;aspect-ratio:2/3;border-radius:10px;background:#16241d center/cover no-repeat;
    border:1px solid rgba(220,184,111,.3);box-shadow:0 8px 24px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
    font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:2.2em;color:rgba(246,239,224,.35)}
  .pimg .tag{position:absolute;top:.45em;right:.45em;font-family:'Thmanyah',sans-serif;font-size:.3em;padding:.15em .7em;border-radius:999px;
    background:rgba(20,120,70,.92);color:#E8FFF1;border:1px solid #7FE0A8}
  .pimg .kind{position:absolute;bottom:.45em;left:.45em;font-family:'Thmanyah',sans-serif;font-size:.26em;padding:.1em .6em;border-radius:6px;
    background:rgba(0,0,0,.65);color:#F1CF8A}
  .pc b{max-width:100%;font-size:.78em;font-weight:500;color:#FFF3D6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:.25em;margin-bottom:-.25em}
  .pc .st{font-size:.6em;color:#C6BBA4;line-height:1.4}
  .pc .st.new{color:#9FF0C2}
  .pc .st .cdn{font-size:1.05em}
  /* the family's occasion of the day: the photo, the wish, the age */
  .week li.bday{display:flex;flex-direction:column;align-items:center;gap:1.5vh;border-bottom:none;padding:1vh 0;white-space:normal;text-align:center}
  .bday .ph{width:21vh;height:21vh;border-radius:50%;background:#16241d center/cover no-repeat;border:3px solid #F3D48A;
    box-shadow:0 0 44px rgba(243,212,138,.35);display:flex;align-items:center;justify-content:center;font-size:9vh}
  .bday b{font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:1.9em;color:#FFF3D6;font-weight:700;line-height:1.25}
  .bday .o{color:#F1CF8A;font-size:1.05em}
  .p-mid .sub .ord{color:#F1CF8A;white-space:nowrap}

  /* v5: the alerts in one row above the bottom line; the next prayer under the prayer times; a lighter bottom */
  .stage{grid-template-rows:auto minmax(0,1fr) auto auto}
  /* its own height, always: a scroll box in a grid row would otherwise shrink to nothing */
  .alerts{margin:0;max-width:none;flex-wrap:nowrap;justify-content:center;align-items:center;overflow:hidden;gap:.7vw;padding:0;min-height:calc(clamp(12px,.95vw,19px) * 2.3)}
  /* the height budget: top, card, alerts row, bottom panels, all inside the screen */
  .stage{padding-bottom:3.4vh;gap:1.3vh}
  .week{height:34vh}
  html.qtop .week{height:30vh}
  .clock{font-size:clamp(110px,min(16vw,26vh),300px)}
  .bottom{padding-top:1.6vh}
  .al{font-size:clamp(12px,.95vw,19px);padding:.32em .9em}
  .pt-next{margin-top:1vh;text-align:left;white-space:nowrap;font-size:clamp(13px,1.08vw,21px);color:#D8CDB6}
  .pt-next b{color:#FFE7AE;font-weight:500}
  .pt-next .cdn{color:#F1CF8A}
  .pt-next.now b{color:#9FF0C2}
  .p-prayer{display:none}
  .bottom{grid-template-columns:1fr 1.5fr}
  .bottom.fam{grid-template-columns:1fr 1fr 1.35fr;gap:2vw}
  .bottom.fam .p-mid .sub{font-size:clamp(11px,.88vw,17px)}
  .p-mid .label{min-width:0;overflow:hidden;text-overflow:ellipsis}
  /* today's games: shorter names, smaller */
  .p-match .big,.mrow .big,.mrow:has(.mblock + .mblock) .big{font-size:clamp(15px,1.25vw,26px)}
  .p-match .sub{font-size:clamp(11px,.82vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .crest{width:.95em;height:.95em}
  /* a child's stars: the total and the last seven days */
  .week li.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:.6vw;align-items:end;border-bottom:none;padding:1vh 0 0;height:14vh}
  .wk span{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.4vh;height:100%;font-size:.62em;color:#9C9279}
  .wk i{display:block;width:62%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#F3D48A,#C99A45);min-height:3px}
  .wk span.today{color:#FFE7AE} .wk span.today i{box-shadow:0 0 14px rgba(243,212,138,.6)}
  .wk b{font-weight:500;color:#F1CF8A;font-size:1.15em}

  /* today's games as small scoreboards (the household's design): the state with its icon, a row per team
     (crest, short name, goals), then the competition and the channel */
  .mrow{gap:1.4vw;align-items:stretch}
  .mrow .mx{flex:1 1 0;min-width:0;max-width:50%;display:flex;flex-direction:column;gap:.55vh;text-align:center}
  .mrow .mx + .mx{padding-inline-start:1.4vw;border-inline-start:1px solid rgba(220,184,111,.25)}
  .p-match .label{display:none}
  .mrow .mx{gap:.4vh}
  .mx-h{display:flex;align-items:center;justify-content:center;gap:.45em;white-space:nowrap;font-size:clamp(12px,.95vw,19px);font-weight:500}
  .mx-h svg{width:1.35em;height:1.35em;flex:0 0 auto}
  .mx-h small{font-size:.78em;font-weight:400;opacity:.85}
  .mx-h.live{color:#5FD38D} .mx-h.next{color:#F0A35E} .mx-h.done{color:#C9C2B2}
  .mx-h.live .bars rect{animation:eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

  color:#F3E2B0;text-shadow:0 1px 3px rgba(0,0,0,.75);letter-spacing:0;opacity:1}

<script>
// daily background: one photo per Riyadh day, deterministic
const BGS = [
__BG_SET__
];
// the app passes the chosen city in the URL fragment: #city=..&lat=..&lon=..&tz=..
const _Q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const _list = k => (_Q.get(k) || '').split(',').map(x=>x.trim()).filter(Boolean);
const _num = (k, d) => { const v = parseFloat(_Q.get(k)); return isNaN(v) ? d : v; };
const CONFIG = {
  city: _Q.get('city') || 'الرياض',
  latitude: _num('lat', 24.7136),
  longitude: _num('lon', 46.6753),
  timezone: _Q.get('tz') || 'Asia/Riyadh',
  prayerMethod: 4,
  // followed teams in priority order: #teams=id,id,... (up to 10); older builds send team1/team2
  teamIds: (_Q.has('teams') ? _Q.get('teams').split(',')
            : [_Q.has('team1') ? _Q.get('team1') : '136013', _Q.has('team2') ? _Q.get('team2') : '136137'])
    .map(x=>(x||'').trim()).filter(x=>/^\d+$/.test(x)).slice(0, 10),
  sportsKey: '123',
  // the card beside the clock: shows | prayers | forecast | matches | verse | home | none (#week=0 from older builds = none)
  panel: (p => ['shows','prayers','forecast','matches','verse','home','none'].includes(p) ? p : 'shows')
         (_Q.get('panel') || (_Q.get('week') === '0' ? 'none' : 'shows')),
  matchesPerPage: 2,
  matchPageMs: 15000,
  // minutes from adhan to iqama (Ministry of Islamic Affairs defaults); Friday Dhuhr has none
  iqama: {Fajr:25, Dhuhr:20, Asr:20, Maghrib:10, Isha:20},
  // "new this week" filters from the app: TVMaze genres, languages, countries, picked show ids
  shows: {
    genres: _list('genres'),
    langs: _list('langs'),
    ids: _list('shows').filter(x=>/^\d+$/.test(x)).slice(0, 30),
    countries: _list('countries').length ? _list('countries') : ['US'],
    minRating: _num('minrating', 7),
  },
  weekWindowDays: 30,
  // #widget=1: only the card, on a transparent page (the launcher's home screen shows it)
  widget: _Q.get('widget') === '1',
};

// Intl.DateTimeFormat is slow to build and the clock asks for one several times a second: one per locale+options
const IDF_CACHE = {};
function IDF(loc, opt){ const k = loc + JSON.stringify(opt || {}); return IDF_CACHE[k] || (IDF_CACHE[k] = new Intl.DateTimeFormat(loc, opt)); }
// write only what changed: no relayout every second for the same text
function setHTML(el, html){ if(el && el.__h !== html){ el.innerHTML = html; el.__h = html; } }
// a box's new content rises softly into place; a running countdown ticking alone is not new content
const softKey = h => h.replace(/(<span class="cdn"[^>]*>)[^<]*/g, '$1');
function softHTML(el, html){
  if(!el) return;
  const k = softKey(html);
  if(el.__k === k) return;
  const first = el.__k === undefined;
  el.__k = k;
  if(first || document.hidden) setHTML(el, html); else crossfade(el, () => setHTML(el, html));
}
// the new content rises into place from below as it fades in
function crossfade(el, update){
  update();
  if(el && !document.hidden){ el.classList.remove('xf-in'); void el.offsetWidth; el.classList.add('xf-in'); }
}
// a live countdown: hh:mm:ss (and days), kept current by tickCountdowns every second
function cdText(ms){
  const t = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), x = t % 60;
  const hms = ar(pad(h)) + ':' + ar(pad(m)) + ':' + ar(pad(x));
  return d ? (d === 1 ? 'يوم' : d === 2 ? 'يومين' : ar(d) + (d <= 10 ? ' أيام' : ' يوم')) + ' و ' + hms : hms;
}
const cdn = (t, done) => `<span class="cdn" data-to="${t}" data-done="${done || 'الآن'}">${cdText(t - Date.now())}</span>`;
function tickCountdowns(){
  const now = Date.now();
  document.querySelectorAll('[data-sand-to]').forEach(el=>{const f=el.querySelector('.sand-fill');if(f)f.style.transform='scaleY('+Math.min(1,Math.max(0,(+el.dataset.sandTo-now)/86400000))+')';});
  document.querySelectorAll('[data-to]').forEach(el => {
    const left = +el.dataset.to - now, txt = left > 0 ? cdText(left) : el.dataset.done;
    if(el.textContent !== txt) el.textContent = txt;
  });
}
const GREG = 'ar-SA-u-ca-gregory-nu-arab';
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const ar = s => String(s).replace(/[0-9]/g, d => AR[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

function riyadhParts(d = new Date()){
  const f = IDF('en-GB',{
    timeZone: CONFIG.timezone, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return { y:+f.year, mo:+f.month, d:+f.day, h:(+f.hour)%24, mi:+f.minute, s:+f.second };
}
function fmt12(h, mi){
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ar(h12)}:${ar(pad(mi))} ${h < 12 ? 'ص' : 'م'}`;
}

function tickClock(){
  const p = riyadhParts();
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  // one box per digit: browsers ignore letter-spacing on Arabic digits, and ٤ reaches into the next digit
  const digits = s => [...s].map(ch => '<i>' + ch + '</i>').join('');
  const turn = (id, deg) => { const el = document.getElementById(id); if(el) el.setAttribute('transform', `rotate(${deg})`); };
  turn('v2-hour', (p.h % 12)*30 + p.mi*.5 + p.s/120);
  turn('v2-minute', p.mi*6 + p.s*.1);
  const key = h12 + ':' + p.mi;
  if(key === tickClock.last) return;   // ticks every second, redraws once a minute
  tickClock.last = key;
  document.getElementById('ck-h').innerHTML = digits(pad(h12));     // as the household writes it: 02:30م
  document.getElementById('ck-m').innerHTML = digits(pad(p.mi));
  document.getElementById('ck-ap').textContent = p.h < 12 ? 'ص' : 'م';
  const h24 = document.getElementById('ck-24');
  if(h24) h24.textContent = ar(pad(p.h)) + ':' + ar(pad(p.mi));
  const w24 = document.getElementById('w-24');
  if(w24) w24.textContent = pad(p.h) + ':' + pad(p.mi);
  const face = document.querySelector('.clock-face');
  if(face && DAY_TIMES) watchLight(face, p.h * 60 + p.mi, DAY_TIMES);
  const dw = document.getElementById('v2-date');
  if(dw) dw.textContent = ar(p.d);
  applyMode();
}

// The watch: the face of the Makkah Royal Clock itself, from photographs (King Eliot, Wikimedia Commons, CC BY-SA 4.0)
// with the photographed hands taken out; its own hands turn over it. Night is the tower as it is lit: the dial green,
// the numerals and hands white, the emblem and the filigree gold. The light follows the sun (watchLight).
const WATCH_BOX = '0 0 1200 1200';
function watchSVG(){
  // the tower's hands: long black blades, gold-trimmed, a gold ornament at the tip and on the tail past the centre
  const hand = (id, len, tail, w, tip) => `<g id="${id}">
<g class="hd"><path d="M${-w*.42} ${tail}L${-w*.5} ${-len + tip}L${-w*.5} ${-len}L${w*.5} ${-len}L${w*.5} ${-len + tip}L${w*.42} ${tail}Z" fill="#14161B" stroke="#C9A04A" stroke-width="3"/>
<path d="M${-w*.32} ${-len + 8}L${w*.32} ${-len + 8}L${w*.32} ${-len + tip - 6}L0 ${-len + tip + 18}L${-w*.32} ${-len + tip - 6}Z" fill="url(#hGold)"/>
<path d="M${-w*.3} ${tail - 8}L${w*.3} ${tail - 8}L${w*.26} ${tail - 52}L0 ${tail - 68}L${-w*.26} ${tail - 52}Z" fill="url(#hGold)"/></g>
<g class="hn"><path d="M${-w*.42} ${tail}L${-w*.5} ${-len + tip}L${-w*.5} ${-len}L${w*.5} ${-len}L${w*.5} ${-len + tip}L${w*.42} ${tail}Z" fill="#F4FFF2" stroke="#FFFFFF" stroke-width="3"/></g></g>`;
  return `<svg class="watch-hands" viewBox="${WATCH_BOX}" aria-hidden="true"><defs>
<linearGradient id="hGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A7428"/><stop offset=".45" stop-color="#FCE7A6"/><stop offset=".6" stop-color="#E4BD62"/><stop offset="1" stop-color="#8A6420"/></linearGradient>
<filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="7" dy="10" stdDeviation="6" flood-opacity=".45"/></filter>
<filter id="hGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g transform="translate(600 603)" filter="url(#hShadow)">
${hand('v2-hour', 300, 95, 52, 92)}
${hand('v2-minute', 452, 135, 40, 104)}
<circle r="30" fill="url(#hGold)" stroke="#5E4416" stroke-width="3"/><circle r="10" fill="#14161B"/></g></svg>`;
}
// how lit the face is: 0 by day, 1 at night; the change runs from 40 minutes before Maghrib to 20 after, and from
// Fajr to 20 minutes after sunrise. --dusk is the warm light in the middle of each change.
function watchLight(face, minutes, times){
  const m = s => { const [h, mi] = String(s).split(':').map(Number); return h * 60 + mi; };
  const ramp = (a, b) => Math.min(1, Math.max(0, (minutes - a) / (b - a)));
  const fajr = m(times.Fajr), rise = m(times.Sunrise), set = m(times.Maghrib);
  let night;
  if(minutes >= fajr && minutes < rise + 20) night = 1 - ramp(fajr, rise + 20);
  else if(minutes >= set - 40 && minutes < set + 20) night = ramp(set - 40, set + 20);
  else night = minutes > rise && minutes < set ? 0 : 1;
  const smooth = night * night * (3 - 2 * night);
  face.style.setProperty('--night', smooth.toFixed(3));
  face.style.setProperty('--dusk', (4 * night * (1 - night)).toFixed(3));
}
// the watch fills its box above the two time lines whatever the box's size
function fitWatch(){
  const f = document.querySelector('.clock-face'), box = f && f.parentNode, t = document.querySelector('.watch-time');
  if(!f || !box.clientHeight) return;
  const fs = Math.max(12, Math.min(box.clientWidth * .11, box.clientHeight * .085));
  t.style.fontSize = fs.toFixed(1) + 'px';
  const d = Math.floor(Math.min(box.clientWidth, box.clientHeight - t.offsetHeight - 6));
  f.style.width = f.style.height = Math.max(0, d) + 'px';
}

// ---------- day and night: from sunrise to Maghrib is day; the look, the photos and the sign follow ----------
const ICON = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="#F3C969" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#F3C969"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#D9E2F2"/></svg>',
  cloud:'<svg viewBox="0 0 24 24"><path d="M7 18.5h10.2a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.8 1.4A3.3 3.3 0 0 0 7 18.5z" fill="#D6DCE4"/></svg>',
  partly:'<svg viewBox="0 0 24 24"><circle cx="8.5" cy="8.5" r="3.6" fill="#F3C969"/><path d="M8.5 2.6v1.4M2.6 8.5H4M4.3 4.3l1 1M12.7 4.3l-1 1" stroke="#F3C969" stroke-width="1.5" stroke-linecap="round"/><path d="M9 19.5h9a3.5 3.5 0 0 0 .3-7 4.9 4.9 0 0 0-9.4 1.2A2.9 2.9 0 0 0 9 19.5z" fill="#D6DCE4"/></svg>',
  rain:'<svg viewBox="0 0 24 24"><path d="M7 14.5h10.2a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.8 1.4A3.3 3.3 0 0 0 7 14.5z" fill="#C3CBD6"/><path d="M8.5 17l-1 3M12.5 17l-1 3M16.5 17l-1 3" stroke="#7FB6E8" stroke-width="1.7" stroke-linecap="round"/></svg>',
  storm:'<svg viewBox="0 0 24 24"><path d="M7 14h10.2a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.8 1.4A3.3 3.3 0 0 0 7 14z" fill="#AEB7C4"/><path d="M12.8 14.5l-2.6 4h2.6l-1.6 3.5" stroke="#F3C969" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fog:'<svg viewBox="0 0 24 24" stroke="#C9CFD8" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M6 13h12M4 17h16"/></svg>',
  snow:'<svg viewBox="0 0 24 24" stroke="#E6F0FA" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>',
  dust:'<svg viewBox="0 0 24 24" stroke="#E8B86A" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5M3 12.5h15a2.5 2.5 0 1 1-2.5 2.5M3 17h8"/></svg>',
};
function wxIcon(code, night){
  if(code === 'dust') return ICON.dust;
  if(code === 0 || code === 1) return night ? ICON.moon : ICON.sun;
  if(code === 2) return night ? ICON.cloud : ICON.partly;
  if(code === 3) return ICON.cloud;
  if(code === 45 || code === 48) return ICON.fog;
  if(code >= 95) return ICON.storm;
  if((code >= 71 && code <= 77) || code === 85 || code === 86) return ICON.snow;
  if(code >= 51) return ICON.rain;
  return ICON.cloud;
}
function minutesOf(k, dflt){
  const v = DAY_TIMES && DAY_TIMES[k];
  if(!v) return dflt;
  const [h, mi] = String(v).split(':').map(Number);
  return h*60 + mi;
}
function isNight(){
  const p = riyadhParts(), m = p.h*60 + p.mi;
  return m < minutesOf('Sunrise', 6*60) || m >= minutesOf('Maghrib', 18*60);
}
let MODE = null;
function applyMode(){
  const night = isNight();
  if(night === MODE) return;
  const first = MODE === null;
  MODE = night;
  document.documentElement.classList.toggle('night', night);
  const el = document.getElementById('mode');
  if(el){ el.innerHTML = (night ? ICON.moon : ICON.sun) + '<b>' + (night ? 'ليل' : 'نهار') + '</b>'; el.classList.toggle('n', night); }
  if(!first){ applyBackground(true); paintWeatherIcon(); }
}

// «الثلاثاء ٩ جمادى الأولى [٥] ١٤٤٨ هـ»: the month's number in a small gold box right after its name,
// isolated from the text direction so it can never flip or read as part of the day
function dateLine(cal, now, showWeekday = true){
  const parts = IDF('ar-SA-u-ca-' + cal + '-nu-latn',{
    timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
  }).formatToParts(now).reduce((a,p)=>(a[p.type]=p.value,a),{});
  const mo = +IDF('en-u-ca-' + cal,{timeZone: CONFIG.timezone, month:'numeric'})
    .format(now).replace(/[^0-9]/g,'');
  const num = s => ar(String(s).replace(/[^0-9]/g,''));
  return `${showWeekday ? esc(parts.weekday) + ' ' : ''}${num(parts.day)} ${esc(parts.month)} <span class="mchip">${ar(mo)}</span> ${num(parts.year)}`;
}
function tickDates(){
  const now = new Date();
  softHTML(document.getElementById('day-name'), esc(IDF(GREG,{timeZone:CONFIG.timezone,weekday:'long'}).format(now)));

// «٣ العقرب [٨] ١٤٠٥ هـ.ش»: the solar Hijri year (the Persian calendar's arithmetic) with the zodiac month names
const BURJ = ['الحمل','الثور','الجوزاء','السرطان','الأسد','السنبلة','الميزان','العقرب','القوس','الجدي','الدلو','الحوت'];
function shamsiLine(now){
  const p = IDF('en-u-ca-persian',{timeZone: CONFIG.timezone, day:'numeric', month:'numeric', year:'numeric'})
    .formatToParts(now).reduce((a, x) => (a[x.type] = x.value, a), {});
  const n = s => +String(s).replace(/[^0-9]/g, ''), m = n(p.month);
  return `${ar(n(p.day))} ${BURJ[m - 1]} <span class="mchip">${ar(m)}</span> ${ar(n(p.year))} هـ.ش`;
}

const PRAYER_KEYS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const PRAYER_NAMES = {Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
let PRAYERS = [];

let DAY_TIMES = null;
function buildPrayers(t){
  DAY_TIMES = t;
  tickClock.last = '';   // the watch's light follows these times: set it now, not at the next minute
  PRAYERS = PRAYER_KEYS.map(k=>{
    const [h,mi] = String(t[k]).split(':').map(Number);
    return {key:k, name:PRAYER_NAMES[k], h, mi};
  });
}

// Umm al-Qura: Fajr at 18.5°, Maghrib at sunset, Isha 90 min after Maghrib (120 in Ramadan),
// Asr at shadow factor 1. Same method as Aladhan's method 4, so the offline times match to a minute or two.
function computePrayers(lat = CONFIG.latitude, lng = CONFIG.longitude){
  const p = riyadhParts();
  const tz = Math.round((Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - Date.now()) / 60000) / 60;
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
  const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a + b : a; };
  const jd0 = Date.UTC(p.y,p.mo-1,p.d)/86400000 + 2440587.5 - lng/(15*24);
  const sun = t => {
    const D = jd0 + t - 2451545;
    const g = fix(357.529 + .98560028*D, 360), q = fix(280.459 + .98564736*D, 360);
    const L = fix(q + 1.915*Math.sin(rad(g)) + .020*Math.sin(rad(2*g)), 360);
    const e = 23.439 - .00000036*D;
    const RA = fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)), Math.cos(rad(L))))/15, 24);
    return {decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA};
  };
  const noon = t => fix(12 - sun(t/24).eqt, 24);
  const angleTime = (angle, t, ccw) => {
    const d = sun(t/24).decl, n = noon(t);
    const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(rad(d))*Math.sin(rad(lat))) /
                            (Math.cos(rad(d))*Math.cos(rad(lat)))))/15;
    return n + (ccw ? -T : T);
  };
  const asrTime = t => {
    const d = sun(t/24).decl;
    const a = -deg(Math.atan(1/(1 + Math.tan(rad(Math.abs(lat - d))))));
    return angleTime(a, t, false);
  };
  const adj = h => h + tz - lng/15;
  const fajr = adj(angleTime(18.5, 5, true)), dhuhr = adj(noon(12)), asr = adj(asrTime(13));
  const sunrise = adj(angleTime(.833, 6, true));
  const maghrib = adj(angleTime(.833, 18, false));
  const isha = maghrib + (hijriMonthNow() === 9 ? 120 : 90)/60;
  const hm = h => { const m = Math.round(fix(h, 24)*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };
  return {Fajr:hm(fajr), Sunrise:hm(sunrise), Dhuhr:hm(dhuhr), Asr:hm(asr), Maghrib:hm(maghrib), Isha:hm(isha)};
}

async function loadPrayers(){
  const p = riyadhParts();
  const url = `https://api.aladhan.com/v1/timings/${pad(p.d)}-${pad(p.mo)}-${p.y}`
            + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
            + `&method=${CONFIG.prayerMethod}&timezonestring=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    const r = await fetchT(url, 12000);
    const j = await r.json();
    if(!j?.data?.timings?.Fajr) throw 0;
    buildPrayers(j.data.timings);
  }catch(e){
    try{ buildPrayers(computePrayers()); }catch(_){}
  }
  tickPrayer();
  applyMode();     // day and night follow the real sunrise and Maghrib as soon as they are known
  tickRamadan();   // Ramadan mode needs the prayer times
  if(CONFIG.panel === 'prayers' || CONFIG.panel === 'home') renderPanel(false);
}

const UNIT = {
  day: {one:'يوم', two:'يومين', few:'أيام', many:'يوم'},
  hour:{one:'ساعة', two:'ساعتين', few:'ساعات', many:'ساعة'},
  min: {one:'دقيقة', two:'دقيقتين', few:'دقائق', many:'دقيقة'}
};
function qty(n,u){
  if(n === 1) return u.one;
  if(n === 2) return u.two;
  if(n >= 3 && n <= 10) return `${ar(n)} ${u.few}`;
  return `${ar(n)} ${u.many}`;
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,UNIT.hour));
  if(m || !h) out.push(qty(m,UNIT.min));
  return out.join(' و ');
}
function shortRemaining(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  const out = [];
  if(d) out.push(qty(d,UNIT.day));
  if(h && out.length < 2) out.push(qty(h,UNIT.hour));
  if(!out.length) out.push(qty(Math.max(1, Math.ceil(ms/60000)), UNIT.min));
  return out.join(' و ');
}

function isFriday(){
  return IDF('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? 'الجمعة' : x.name; }

function tickPrayer(){
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = riyadhParts();
  const mins = p.h*60 + p.mi + p.s/60;
  renderPrayerStrip(mins);
  renderAlerts();

  // between adhan and iqama: show the iqama countdown
  const cur = PRAYERS.find(x=>{
    const at = x.h*60 + x.mi;
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at && mins < at + gap;
  });
  if(cur){
    const left = (cur.h*60 + cur.mi + CONFIG.iqama[cur.key]) - mins;
    panel.classList.add('now');
    elL.textContent = 'حان الآن';
    elN.textContent = prayerName(cur);
    elT.textContent = fmt12(cur.h, cur.mi);
    elC.innerHTML = 'الإقامة بعد <b>' + humanRemaining(Math.max(60, Math.ceil(left)*60)) + '</b>';
    return;
  }

  panel.classList.remove('now');
  elL.textContent = 'الصلاة القادمة';
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  elN.textContent = prayerName(next);
  elT.textContent = fmt12(next.h, next.mi);
  elC.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round(leftM*60))) + '</b>';
}

// top left: the day's prayers with sunrise and the middle of the night; the next one (prayer or event) is boxed
// in gold, and under the strip the time left to it. Between adhan and iqama the prayer that has come stays boxed.
function renderPrayerStrip(mins){
  const strip = document.getElementById('pt-strip');
  if(!strip || !PRAYERS.length) return;
  const at = x => x.h*60 + x.mi;
  const items = PRAYERS.slice();
  const sr = minutesOf('Sunrise', null);
  if(sr != null) items.splice(1, 0, {aux:true, name:'الشروق', h:Math.floor(sr/60), mi:sr%60});
  const mg = PRAYERS.find(x => x.key === 'Maghrib'), fj = PRAYERS[0];
  if(mg && fj){
    const mid = Math.round(at(mg) + (at(fj) + 1440 - at(mg)) / 2) % 1440;
    items.push({aux:true, name:'منتصف الليل', h:Math.floor(mid/60), mi:mid%60});
  }
  const cur = PRAYERS.find(x => {
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at(x) && mins < at(x) + gap;
  });
  // the next of all of them, across midnight
  const ahead = x => ((at(x) - mins) % 1440 + 1440) % 1440 || 1440;
  const lit = cur || items.reduce((a, x) => ahead(x) < ahead(a) ? x : a, items[0]);
  softHTML(strip, items.map(x => {
    const passed = x !== lit && at(x) <= mins;
    const cls = x === lit ? 'next' : passed ? 'past' : x.aux ? 'aux' : '';
    const h12 = x.h % 12 === 0 ? 12 : x.h % 12;
    return `<span class="q ${cls}"><span class="n">${x.aux ? x.name : prayerName(x)}</span><span class="t">${ar(h12)}:${ar(pad(x.mi))}<small>${x.h < 12 ? 'ص' : 'م'}</small></span></span>`;
  }).join(''));
  // under the strip: the boxed one and how long until it; between adhan and iqama, the iqama
  const nx = document.getElementById('pt-next');
  if(!nx) return;
  if(cur){
    const left = Math.max(60, Math.round((at(cur) + CONFIG.iqama[cur.key] - mins) * 60));
    nx.className = 'pt-next now';
    setHTML(nx, `حان الآن <b>${prayerName(cur)}</b> · الإقامة بعد <b>${humanRemaining(left)}</b>`);
  }else{
    nx.className = 'pt-next';
    setHTML(nx, `<b>${lit.aux ? lit.name : prayerName(lit)}</b> بعد <b>${humanRemaining(Math.max(0, Math.round(ahead(lit) * 60)))}</b>`);
  }
}

// ---------- alerts under the clock ----------
const WARN_ICON = c => `<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z" fill="${c}"/><path d="M12 9v5" stroke="#1a1208" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="#1a1208"/></svg>`;
const pill = (cls, text, icon) => `<span class="al ${cls}">${icon || ''}<span>${text}</span></span>`;
const SEV = {1:['w1','منخفضة','#F2D46B'], 2:['w2','متوسطة','#F2A24B'], 3:['w3','عالية','#F06A5A']};
let DUST_PM = 0;
const digitsOf = s => +String(s).replace(/[^0-9]/g, '');
function hijriOf(d){
  const p = IDF('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,day:'numeric',month:'numeric'})
    .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return {m: digitsOf(p.month), d: digitsOf(p.day)};
}
const weekdayOf = d => IDF('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(d);
// why a day is a fasting day (Umm al-Qura); none on the Eids, the days of Tashreeq and in Ramadan
function fastReasons(d){
  const h = hijriOf(d), wd = weekdayOf(d), out = [];
  if(h.m === 9 || (h.m === 10 && h.d === 1) || (h.m === 12 && h.d >= 10 && h.d <= 13)) return out;
  if(h.m === 12 && h.d === 9) out.push('يوم عرفة');
  if(h.m === 1 && h.d === 9) out.push('تاسوعاء');
  if(h.m === 1 && h.d === 10) out.push('عاشوراء');
  if(h.m === 10 && h.d >= 2) out.push('الست من شوال');
  if(h.d >= 13 && h.d <= 15) out.push('الأيام البيض');
  if(wd === 'Mon') out.push('الاثنين');
  if(wd === 'Thu') out.push('الخميس');
  return out;
}
function weatherAlerts(){
  const out = [], t = FORECAST[0];
  const add = (lvl, text) => { const [c, word, col] = SEV[lvl]; out.push(pill(c, `${text} <small>· خطورة ${word}</small>`, WARN_ICON(col))); };
  if(DUST_PM >= 400) add(3, 'غبار كثيف'); else if(DUST_PM >= 150) add(2, 'غبار');
  const codes = [WX_NOW, t && t.code].filter(c => typeof c === 'number');
  if(codes.some(c => c >= 95)) add(3, 'عواصف رعدية');
  else if(codes.some(c => c === 65 || c === 82 || c === 67)) add(3, 'أمطار غزيرة');
  else if(codes.some(c => (c >= 61 && c <= 66) || c === 80 || c === 81)) add(2, 'أمطار');
  else if(codes.some(c => c >= 51 && c <= 57)) add(1, 'رذاذ');
  if(codes.some(c => c === 45 || c === 48)) add(2, 'ضباب');
  if(t && t.hi >= 48) add(3, `حرارة شديدة ${ar(Math.round(t.hi))}°`);
  else if(t && t.hi >= 45) add(2, `حرارة عالية ${ar(Math.round(t.hi))}°`);
  return out;
}
function matchAlerts(now){
  const out = [], seen = new Set();
  CONFIG.teamIds.forEach(id => {
    const ev = MATCHES[id];
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;
    seen.add(ev.idEvent);
    const t = toDate(ev).getTime(), mine = String(ev.idHomeTeam) === id;
    const me = teamAr(mine ? ev.strHomeTeam : ev.strAwayTeam), them = teamAr(mine ? ev.strAwayTeam : ev.strHomeTeam);
    const scored = ev.intHomeScore != null && ev.intAwayScore != null;
    if(now >= t && now < t + 2.5*3600000 && !FINAL.includes((ev.strStatus || '').toUpperCase()))
      out.push(pill('live', `مباشر: ${esc(teamAr(ev.strHomeTeam, ev.idHomeTeam))} ${scored ? ar(+ev.intHomeScore) + ' - ' + ar(+ev.intAwayScore) : '×'} ${esc(teamAr(ev.strAwayTeam, ev.idAwayTeam))}`));
    else if(t > now && t - now <= 3*3600000)
      out.push(pill('match', `${esc(me)} يلعب بعد ${cdn(t, 'الآن')} <small>ضد ${esc(them)}${channelOf(ev) ? ' · ' + esc(channelOf(ev)) : ''}</small>`));
  });
  return out;
}
function renderAlerts(){
  const box = document.getElementById('alerts');
  if(!box || CONFIG.widget) return;
  const now = Date.now(), p = riyadhParts(), mins = p.h*60 + p.mi + p.s/60, out = [];
  const at = x => x.h*60 + x.mi;
  const maghrib = minutesOf('Maghrib', 18*60);
  // prayer: 10 minutes before the adhan
  const next = PRAYERS.find(x => at(x) > mins && at(x) - mins <= 10);
  if(next) out.push(pill('prayer', `${prayerName(next)} بعد ${humanRemaining(Math.max(60, Math.round((at(next) - mins)*60)))}`));
  // Friday: from Thursday's Maghrib to Friday's Maghrib, and the hour and a half before the Friday prayer
  const wd = weekdayOf(new Date());
  if((wd === 'Thu' && mins >= maghrib) || (wd === 'Fri' && mins < maghrib)){
    out.push(pill('fri', 'قراءة سورة الكهف'));
    out.push(pill('fri', 'أكثروا من الصلاة على النبي <span class="saw">ﷺ</span>'));
  }
  const dh = PRAYERS.find(x => x.key === 'Dhuhr');
  if(wd === 'Fri' && dh && at(dh) - mins > 10 && at(dh) - mins <= 90)
    out.push(pill('fri', `صلاة الجمعة بعد ${humanRemaining(Math.round((at(dh) - mins)*60))} <small>· التبكير إليها</small>`));
  // fasting: today until Maghrib, then tomorrow
  const day = mins < maghrib ? new Date() : new Date(now + 86400000);
  const why = fastReasons(day);
  if(why.length) out.push(pill('fast', `${mins < maghrib ? 'اليوم' : 'غداً'}: صيام ${why.join('، ')}`));
  if(!GUEST()) out.push(...bedtimeAlerts(now), ...gameAlerts(now), ...wirdAlerts(), ...reminderAlerts(), ...taskAlerts(), ...seriesAlerts(now));
  out.push(...matchAlerts(now), ...weatherAlerts());
  pageAlerts(box, out);
  renderAdhan(mins);
}
// One row under the card. When they do not all fit, they take turns a row at a time, most important first.
let ALERT_PAGES = [], ALERT_PAGE = 0;
function pageAlerts(box, items){
  box.innerHTML = items.join('');
  const room = box.clientWidth, gap = parseFloat(getComputedStyle(box).columnGap) || 0, pages = [];
  let used = Infinity;
  [...box.children].forEach((el, i) => {
    const w = el.offsetWidth;
    if(used + gap + w > room){ pages.push([]); used = -gap; }
    used += gap + w; pages[pages.length - 1].push(items[i]);
  });
  ALERT_PAGES = pages.map(p => p.join(''));
  box.__h = null;
  showAlerts(false);
}
function showAlerts(turn){
  const box = document.getElementById('alerts'), n = ALERT_PAGES.length;
  if(!box) return;
  if(turn && n > 1) ALERT_PAGE++;
  const html = n ? ALERT_PAGES[ALERT_PAGE % n] : '';
  softHTML(box, html);
}
// the first 5 minutes after an adhan: a large panel over the card; the iqama countdown stays in the bottom panel
function renderAdhan(mins){

  if(!el || ADHAN_ACTIVE) return;

  if(!cur || ADHAN_FINISHED===todayKey()+cur.key){ el.classList.remove('on'); return; }
  setHTML(el, `<div class="a1">حان الآن وقت</div><div class="a2">صلاة ${prayerName(cur)}</div>`
    + `<div class="a3">${fmt12(cur.h, cur.mi)} · بتوقيت ${esc(CONFIG.city)}</div>`);
  el.classList.add('on');

}
// The Makkah adhan, once per prayer in its first minute, from the Haram's own channel (شؤون الأئمة والمؤذنين,
// youtube.com/@Emam_moathen), played by the app in the stream's window (YouTube's player stays visible): in full,
// or the opening takbirs only (its first 30 s). Chosen on the phone page, Fajr apart: full | takbir | off.
const ADHAN_VIDEO = {
  main: 'tJPNo41mOjg',   // Sheikh Ali Mulla (بروق المباسم من نداءات المواسم), picked by the household
  fajr: 'tJPNo41mOjg',   // the same, for Fajr too (the household's choice)
};
let ADHAN_DONE = '', ADHAN_FINISHED = '', ADHAN_ACTIVE = false, ADHAN_STOP = null;
function adhanMode(fajr){
  const d = DISP(), ok = m => ['full', 'takbir', 'off'].includes(m) ? m : null;
  if(d.adhanSound === false) return 'off';                        // older phone pages
  if(fajr) return ok(d.adhanFajrMode) || (d.adhanFajr === false ? 'off' : ok(d.adhanMode) || 'full');
  return ok(d.adhanMode) || 'full';
}
function playAdhan(cur){
  const key=todayKey()+cur.key;
  if(ADHAN_DONE===key || CONFIG.widget)return;
  const mode=adhanMode(cur.key==='Fajr');ADHAN_DONE=key;
  if(mode==='off')return;
  const files=CTRL.files || {}, own=n=>files[n] && files[n].size>0;
  const video=cur.key==='Fajr' && own('adhan-video-fajr') ? 'adhan-video-fajr' : own('adhan-video-main') ? 'adhan-video-main' : null;
  const audio=cur.key==='Fajr' && own('adhan-fajr') ? 'adhan-fajr' : own('adhan-main') ? 'adhan-main' : null;
  const host=document.getElementById('adhan'), week=document.querySelector('.week');
  let media=null, timer=null, finished=false;
  const stopMedia=()=>{clearTimeout(timer);if(media){media.onended=null;media.onerror=null;media.onplaying=null;media.onwaiting=null;media.ontimeupdate=null;media.pause();media.removeAttribute('src');media.load();media=null;}};
  const finish=()=>{if(finished)return;finished=true;stopMedia();adhanVolume(false);ADHAN_ACTIVE=false;ADHAN_FINISHED=key;week.classList.remove('adhan-playing');host.classList.remove('on');host.replaceChildren();host.__h=null;renderPanel(false);};
  ADHAN_STOP=finish;   // «إيقاف الاختبار» on the phone
  const start=(name,isVideo)=>{
    stopMedia();
    if(!name){finish();return;}
    ADHAN_ACTIVE=true;week.classList.add('adhan-playing');host.classList.add('on');host.replaceChildren();host.__h=null;
    media=document.createElement(isVideo?'video':'audio');media.preload='auto';media.autoplay=true;media.muted=false;media.setAttribute('playsinline','');
    media.src=`http://127.0.0.1:8766/file/${name}?v=${files[name].at}`;
    if(isVideo){media.className='adhan-local-video';host.appendChild(media);}
    else {host.textContent='حان وقت صلاة '+prayerName(cur);host.appendChild(media);}
    const current=media;
    const fail=()=>{if(finished || media!==current)return;if(isVideo && audio)start(audio,false);else finish();};
    media.onended=finish;media.onerror=fail;
    media.onplaying=()=>clearTimeout(timer);
    media.onwaiting=()=>{clearTimeout(timer);timer=setTimeout(fail,15000);};
    media.ontimeupdate=()=>{if(mode==='takbir' && current.currentTime>=30)finish();};
    timer=setTimeout(fail,15000);
    try{const play=media.play();if(play)play.catch(fail);}catch(e){fail();}
  };
  if(video || audio) adhanVolume(true);
  start(video || audio,!!video);
}
// the adhan at the household's level (20 of 100 unless the phone page says otherwise), the TV's own volume after

// short sounds made here (no files): a soft chime, and a referee's whistle for kick-off
let ACTX = null;
function actx(){ try{ ACTX = ACTX || new (window.AudioContext || window.webkitAudioContext)(); if(ACTX.state === 'suspended') ACTX.resume(); }catch(e){} return ACTX; }
function chime(){
  const A = actx(); if(!A) return;
  [[880, 0], [1318.5, .38], [1760, .76]].forEach(([f, at]) => {
    const o = A.createOscillator(), g = A.createGain(), t = A.currentTime + .05 + at;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.28, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + 1.4);
    o.connect(g); g.connect(A.destination); o.start(t); o.stop(t + 1.5);
  });
}
function softChime(){
  const A = actx(); if(!A) return;
  [[784, 0], [1046.5, .22]].forEach(([f, at]) => {
    const o = A.createOscillator(), g = A.createGain(), t = A.currentTime + .05 + at;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + .9);
    o.connect(g); g.connect(A.destination); o.start(t); o.stop(t + 1);
  });
}
// tasks and reminders at their time (every person's, the sound is for the house); off on the phone page
let CHIMED = (()=>{ try{ return JSON.parse(localStorage.getItem('chimed') || '{}'); }catch(e){ return {}; } })();
function taskMoments(){
  if(CONFIG.widget || DISP().taskSound === false) return;
  const now = Date.now(), p = riyadhParts(), mins = p.h*60 + p.mi, wd = new Date(Date.UTC(p.y, p.mo-1, p.d)).getUTCDay();
  let ring = false;
  (CTRL.tasks || []).forEach(t => {
    if(t.done || !t.due) return;
    const due = new Date(t.due).getTime(), k = 't' + (t.id || t.text) + t.due;
    if(now >= due && now - due < 90000 && !CHIMED[k]){ CHIMED[k] = now; ring = true; }
  });
  (CTRL.reminders || []).forEach(r => {
    const [h, mi] = String(r.time || '0:0').split(':').map(Number), k = 'r' + (r.id || r.text) + todayKey();
    if((r.days || []).includes(wd) && mins === h*60 + mi && r.doneOn !== todayKey() && !CHIMED[k]){ CHIMED[k] = now; ring = true; }
  });
  for(const k in CHIMED) if(now - CHIMED[k] > 3*86400000) delete CHIMED[k];
  try{ localStorage.setItem('chimed', JSON.stringify(CHIMED)); }catch(e){}
  if(ring) softChime();
}
function whistle(){
  if(DISP().whistle === '1') return whistle1();
  const A = actx(); if(!A) return;
  // a pea whistle: the tone with its trill, and the breath through it
  const noise = A.createBuffer(1, A.sampleRate * 2.6, A.sampleRate), d = noise.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  [[0, .32], [.48, .32], [.96, 1.2]].forEach(([at, dur]) => {
    const t = A.currentTime + .05 + at;
    const o = A.createOscillator(), g = A.createGain(), lfo = A.createOscillator(), lg = A.createGain();
    o.type = 'sine'; o.frequency.value = 3050; lfo.frequency.value = 40; lg.gain.value = 300;
    lfo.connect(lg); lg.connect(o.frequency);
    const n = A.createBufferSource(), bp = A.createBiquadFilter(), ng = A.createGain();
    n.buffer = noise; bp.type = 'bandpass'; bp.frequency.value = 3100; bp.Q.value = 6;
    n.connect(bp); bp.connect(ng); ng.connect(g); o.connect(g); g.connect(A.destination);
    ng.gain.value = .9;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.3, t + .025); g.gain.setValueAtTime(.3, t + dur - .06); g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); lfo.start(t); n.start(t, at); o.stop(t + dur + .05); lfo.stop(t + dur + .05); n.stop(t + dur + .05);
  });
}
function whistle1(){
  const A = actx(); if(!A) return;
  [[0, .32], [.48, .32], [.96, 1.2]].forEach(([at, d]) => {
    const o = A.createOscillator(), g = A.createGain(), lfo = A.createOscillator(), lg = A.createGain(), t = A.currentTime + .05 + at;
    o.type = 'sine'; o.frequency.value = 3050; lfo.frequency.value = 34; lg.gain.value = 220;   // the pea's trill
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.3, t + .025); g.gain.setValueAtTime(.3, t + d - .06); g.gain.linearRampToValueAtTime(0, t + d);
    o.connect(g); g.connect(A.destination); o.start(t); lfo.start(t); o.stop(t + d + .05); lfo.stop(t + d + .05);
  });
}
// the live Makkah stream by itself for the Friday prayer and for Taraweeh in Ramadan (Makkah's own times),
// switched off again at the end unless it was already on; off from the phone page
function autoQuran(){
  if(CONFIG.widget || DISP().autoQuran === false) return;
  let w = null;
  try{
    const mk = computePrayers(21.4225, 39.8262), m = s => hm2m(s, null), p = riyadhParts(), now = p.h*60 + p.mi;
    if(weekdayOf(new Date()) === 'Fri' && m(mk.Dhuhr) != null) w = {k: todayKey() + ':fri', from: m(mk.Dhuhr) - 15, to: m(mk.Dhuhr) + 50};
    else if(hijriMonthNow() === 9 && m(mk.Isha) != null) w = {k: todayKey() + ':tar', from: m(mk.Isha) - 5, to: m(mk.Isha) + 150};
    if(w && !(now >= w.from && now < w.to)) w = null;
  }catch(e){ return; }
  const set = on => fetch('http://127.0.0.1:8766/api/autoquran', {method: 'POST', body: JSON.stringify({on})}).catch(() => {});
  let st = {};
  try{ st = JSON.parse(localStorage.getItem('autoQ') || '{}'); }catch(e){}
  if(w && st.k !== w.k){
    st = {k: w.k, mine: !CTRL.quran};
    if(!CTRL.quran) set(true);
  }else if(!w && st.mine){ set(false); st.mine = false; }
  try{ localStorage.setItem('autoQ', JSON.stringify(st)); }catch(e){}
}

let RAM_CACHE = {day:'', val:null};
function ramadanStart(){
  const dayKey = IDF('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  if(RAM_CACHE.day === dayKey) return RAM_CACHE.val;
  const fmt = IDF('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'});
  let found = null;
  for(let i=0;i<400;i++){
    const d = new Date(Date.now()+i*86400000);
    if(fmt.format(d) === '9'){
      const p = riyadhParts(d);
      const hy = +IDF('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
        .format(d).replace(/[^0-9]/g,'');
      found = {y:p.y, mo:p.mo, d:p.d, hy};
      break;
    }
  }
  RAM_CACHE = {day: dayKey, val: found};
  return found;
}
function hijriYearNow(){
  try{
    return +IDF('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 1448; }
}
function hijriMonthNow(){
  try{
    return +IDF('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 0; }
}
