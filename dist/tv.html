// 1) built-in table, 2) the Arabic label on Wikidata (cached on the device), 3) transliteration meanwhile
const AR_NAMES = (()=>{ try{ return JSON.parse(localStorage.getItem('arNames') || '{}'); }catch(e){ return {}; } })();
const AR_PENDING = new Set();
const AR_KIND = {team:/football|soccer|club|team|منتخب|نادي/i, show:/television|series|sitcom|anime|miniseries|show|مسلسل/i};
const hasArabic = s => /[؀-ۿ]/.test(s);

const TL_WORDS = {the:'ذا',of:'أوف',and:'آند',a:'إيه',in:'إن',on:'أون',to:'تو',us:'أس',fc:'',cf:'',sc:'',afc:'',
  united:'يونايتد',city:'سيتي',real:'ريال',club:'كلوب',sporting:'سبورتنغ',saint:'سانت',st:'سانت'};
const TL_LETTERS = {a:'إيه',b:'بي',c:'سي',d:'دي',e:'إي',f:'إف',g:'جي',h:'إتش',i:'آي',j:'جيه',k:'كيه',l:'إل',m:'إم',
  n:'إن',o:'أو',p:'بي',q:'كيو',r:'آر',s:'إس',t:'تي',u:'يو',v:'في',w:'دبليو',x:'إكس',y:'واي',z:'زد'};
function translit(en){
  const map = {sh:'ش',kh:'خ',th:'ث',dh:'ذ',gh:'غ',ch:'تش',ph:'ف',ck:'ك',qu:'كو',ou:'و',oo:'و',ee:'ي',
    a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',
    q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  const start = {a:'أ',e:'إ',i:'إ',o:'أو',u:'أ'};
  const word = w => {
    if(hasArabic(w) || !/[A-Za-z0-9]/.test(w)) return w;
    const lw = w.toLowerCase();
    if(TL_WORDS[lw] !== undefined) return TL_WORDS[lw];
    if(/^[A-Z]{2,4}$/.test(w)) return lw.split('').map(c=>TL_LETTERS[c]).join(' ');   // CP, PSG
    if(/^al-/.test(lw)) return 'ال' + word(w.slice(3));
    let out = '', x = lw.replace(/(.)\1/g,'$1');
    for(let i = 0; i < x.length;){
      const two = i+1 < x.length ? map[x.slice(i,i+2)] : undefined;
      if(i === 0 && start[x[0]] && !two){ out += start[x[0]]; i++; continue; }
      if(two){ out += two; i += 2; continue; }
      const ch = x[i];
      if(ch === 'e' && i > 0){ i++; continue; }                         // short or silent e
      if(ch === 'c' && /[eiy]/.test(x[i+1] || '')){ out += 'س'; i++; continue; }
      out += /[0-9]/.test(ch) ? ar(ch) : (map[ch] || '');
      i++;
    }
    return out;
  };
  return String(en).replace(/&/g,' و ').replace(/\bAl (?=[A-Z])/g,'Al-')
    .split(/(\s+)/).map(word).join('').replace(/\s{2,}/g,' ').trim();
}

async function wikidataArabic(en, kind){
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*';
  const r = await fetchT(`${api}&action=wbsearchentities&type=item&limit=7&language=en&search=${encodeURIComponent(en)}`, 10000);
  const hits = ((await r.json()).search || []).filter(h => AR_KIND[kind].test(h.description || ''));
  if(!hits.length) return '';
  const r2 = await fetchT(`${api}&action=wbgetentities&props=labels&languages=ar&ids=${hits.slice(0,3).map(h=>h.id).join('|')}`, 10000);
  const ents = (await r2.json()).entities || {};
  for(const h of hits.slice(0,3)){
    const l = ents[h.id] && ents[h.id].labels && ents[h.id].labels.ar;
    if(l && l.value) return l.value.replace(/\s*\([^)]*\)\s*/g,' ').replace(/^(نادي|فريق)\s+/,'').trim();
  }
  return '';
}

let arQueue = Promise.resolve();
function arName(en, kind){
  en = String(en || '').trim();
  if(!en || hasArabic(en)) return en;
  if(kind === 'team'){
    const k = TEAM_KEYS[teamKey(en)];
    if(k) return k;
  }
  const key = kind + ':' + en;
  if(AR_NAMES[key] !== undefined) return AR_NAMES[key] || translit(en);
  if(!AR_PENDING.has(key)){
    AR_PENDING.add(key);
    arQueue = arQueue.then(async ()=>{            // one lookup at a time
      try{
        AR_NAMES[key] = await wikidataArabic(en, kind);   // '' = Wikidata has none: keep the transliteration
        try{ localStorage.setItem('arNames', JSON.stringify(AR_NAMES)); }catch(e){}
        if(AR_NAMES[key]){ renderMatches(); renderPanel(false); }
      }catch(e){}                                    // offline: try again next time
      AR_PENDING.delete(key);
    });
  }
  return translit(en);
}
function teamAr(s, id){
  // Provider identity wins over punctuation-normalized names and cached translations.
  if(String(id) === '136021') return 'الفيصلي السعودي';
  if(String(id) === '139529') return 'الفيصلي الأردني';
  return arName(s, 'team');
}

async function fetchNext(id){
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventsnext.php?id=${id}`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const j = await r.json();
  if(j?.events) NEXT_LIST[id] = j.events;
  return (j?.events || [])[0] || null;
}
function toDate(ev){
  const s = ev.strTimestamp || `${ev.dateEvent}T${ev.strTime || '00:00:00'}`;
  return new Date(s.endsWith('Z') ? s : s+'Z');
}

// one slot per picked team: a result from the last 24h, else a fixture this week, else hidden
// A game is over once its status says so, or 2.5 h after kick-off; its score stays up for a day after that.
const FINAL = ['FT','AET','PEN','MATCH FINISHED'];
function finishedRecently(ev, now){
  if(!ev || ev.intHomeScore == null || ev.intAwayScore == null) return false;
  const k = toDate(ev).getTime(), end = k + 2.5*3600000;
  const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= k : now >= end;
  return over && now - end < 86400000;
}
// Keep a score seen at the final whistle: the free API's "last games" list can lag, and "next game"
// moves on to the following fixture right away. Saved, so a restart within the day still shows it.
const KEPT = (()=>{ try{ return JSON.parse(localStorage.getItem('keptResults') || '{}'); }catch(e){ return {}; } })();
function keepResult(id, ev){
  if(!finishedRecently(ev, Date.now())) return;
  KEPT[id] = [ev, ...(KEPT[id] || []).filter(x => x.idEvent !== ev.idEvent && finishedRecently(x, Date.now()))];
  try{ localStorage.setItem('keptResults', JSON.stringify(KEPT)); }catch(e){}
}
function resultsFor(id){
  const seen = new Set();
  return [...(RESULTS[id] || []), ...(KEPT[id] || []), MATCHES[id]]
    .filter(ev => ev && ev.idEvent && !seen.has(ev.idEvent) && seen.add(ev.idEvent));
}

// a team's crest (TheSportsDB, small size); a broken image just disappears
const crest = url => url ? `<img class="crest" src="${esc(url)}/tiny" alt="" onerror="this.remove()">` : '';
const homeSide = ev => `${crest(ev.strHomeTeamBadge)}${esc(teamAr(ev.strHomeTeam, ev.idHomeTeam))}`;
const awaySide = ev => `${esc(teamAr(ev.strAwayTeam, ev.idAwayTeam))}${crest(ev.strAwayTeamBadge)}`;

// while a picked team is playing, refresh that event every 2 minutes
async function loadLive(){
  const now = Date.now();
  await Promise.all(Object.entries(MATCHES).map(async ([id, ev])=>{
    if(!ev || !ev.idEvent) return;
    const k = toDate(ev).getTime();
    if(now < k - 5*60000 || now > k + 2.5*3600000) return;
    try{
      const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/lookupevent.php?id=${ev.idEvent}`, 10000);
      const j = await r.json();
      const fresh = (j.events || [])[0];
      if(fresh && fresh.idEvent === ev.idEvent){ MATCHES[id] = Object.assign({}, ev, fresh); keepResult(id, MATCHES[id]); }
    }catch(e){}
  }));
  renderMatches();
}

// ---------- full rounds: the free API lists only 3 games for a day, but a whole round (all its games) ----------
const SDB = () => `https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}`;
const ROUND_CACHE = {}, NEXT_CACHE = {};   // "league|round|season" / league -> {at, ...}
// the free API allows about 30 calls a minute for the whole home (both TVs share one address): one at a time, 4 s apart
// Two lines: today's games and live scores go first; the followed teams' month ahead and the channels wait behind.
const SDB_Q = [[], []];
let SDB_BUSY = false;
function sdbGet(path, low){
  return new Promise(res => { SDB_Q[low ? 1 : 0].push({path, res}); sdbPump(); });
}
async function sdbPump(){
  if(SDB_BUSY) return;
  SDB_BUSY = true;
  for(let job; (job = SDB_Q[0].shift() || SDB_Q[1].shift()); ){
    const t0 = Date.now();
    job.res(await getJSON(`${SDB()}/${job.path}`, null));
    const wait = 4000 - (Date.now() - t0);
    if(wait > 0) await new Promise(r => setTimeout(r, wait));
  }
  SDB_BUSY = false;
}
async function roundEvents(league, round, season, maxAgeMs, low){
  const key = league + '|' + round + '|' + season, c = ROUND_CACHE[key];
  if(c && Date.now() - c.at < maxAgeMs) return c.events;
  const path = `eventsround.php?id=${league}&r=${round}&s=${encodeURIComponent(season)}`;
  const j = await sdbGet(path, low) || await sdbGet(path, low);   // one retry
  if(!j) return c ? c.events : null;                     // failed: null, not "no games"
  const events = j.events || [];
  ROUND_CACHE[key] = {at: Date.now(), events};
  return events;
}
const SDB_FAIL = {};   // a call that got no answer: not the same as "no games"
async function nextOfLeague(league, low){
  const c = NEXT_CACHE[league];
  if(c && Date.now() - c.at < 10*60000) return c.ev;
  const path = `eventsnextleague.php?id=${league}`;
  const j = await sdbGet(path, low) || await sdbGet(path, low);
  if(!j) return c ? c.ev : SDB_FAIL;
  const ev = j.events && j.events[0] || null;
  NEXT_CACHE[league] = {at: Date.now(), ev};
  return ev;
}
// a league's games between `fromMs` and `toMs`, round by round. The API's "next" game can be an old postponed
// one, so rounds that are wholly past are skipped until the upcoming ones; a past round is kept for a day.
async function leagueGames(league, fromMs, toMs, maxAgeMs, low){
  const nx = await nextOfLeague(league, low);
  if(nx === SDB_FAIL) return null;
  if(!nx) return [];
  const r = parseInt(nx.intRound, 10);
  if(!r || r > 500){   // cups name their rounds oddly: just the next game
    const t = toDate(nx).getTime();
    return t >= fromMs && t <= toMs ? [nx] : [];
  }
  const out = [];
  for(let i = -1; i < 14 && r + i > 0; i++){
    const evs = await roundEvents(league, r + i, nx.strSeason, maxAgeMs, low);
    if(evs === null) return null;   // a round that did not answer: the caller keeps what it had
    if(!evs.length) break;
    const ts = evs.map(e => toDate(e).getTime());
    if(Math.max(...ts) < fromMs){ ROUND_CACHE[league + '|' + (r + i) + '|' + nx.strSeason].at = Date.now() + 18*3600000; continue; }
    evs.forEach((e, k) => { if(ts[k] >= fromMs && ts[k] <= toMs) out.push(e); });
    if(Math.min(...ts) > toMs) break;
  }
  return out;
}

// ---------- live scores every 60 s: only the games being played now (one call each) ----------
async function refreshLive(){
  const now = Date.now(), seen = new Set(), live = [];
  const consider = ev => { if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return; seen.add(ev.idEvent);
    const t = toDate(ev).getTime();
    if(now >= t - 5*60000 && now <= t + 2.5*3600000 && !FINAL.includes((ev.strStatus || '').toUpperCase())) live.push(ev); };
  TODAY_GAMES.forEach(x => consider(x.ev)); Object.values(MATCHES).forEach(consider); TEAM_FIX.forEach(consider);
  // today's leagues, every minute while any of their games is still to finish: one call each for all their games,
  // so scores, the minute, a postponement or a cancellation show within a minute; a followed team elsewhere one by one
  const todays = new Set(TODAY_GAMES.map(x => x.ev.idEvent));
  let fresh = false;
  for(const [rank, [lg, name]] of TOP_LEAGUES.entries()){
    const mine = TODAY_BY[lg] || [];
    if(!mine.some(x => gameState(Object.assign(x, {t: x.t || toDate(x.ev).getTime()}), now) !== 'done')) continue;
    const evs = await dayGames(lg);
    if(!evs) continue;
    evs.filter(f => riyadhDay(toDate(f)) === TODAY_DAY).forEach(f => {
      const x = mine.find(y => y.ev.idEvent === f.idEvent);
      if(x) Object.assign(x.ev, f); else mine.push({ev: f, rank, lg: name});   // the same object everywhere it is shown
    });
    TODAY_BY[lg] = mine; fresh = true;
  }
  if(fresh) buildToday();
  for(const ev of live.filter(ev => !todays.has(ev.idEvent))){
    const j = await sdbGet(`lookupevent.php?id=${ev.idEvent}`);
    const fresh = j && j.events && j.events[0];
    if(fresh && fresh.idEvent === ev.idEvent) Object.assign(ev, fresh);   // the same object everywhere it is shown
  }
  if(live.length){ Object.keys(MATCHES).forEach(id => keepResult(id, MATCHES[id])); renderMatches(); renderAlerts(); if(ROTATES()) renderPanel(false); }
}

  const days = [];
  for(let i=0;i<7;i++) days.push(IDF('en-CA',{timeZone:CONFIG.timezone}).format(new Date(Date.now()+i*86400000)));
  const inWeek = d => d && d >= days[0] && d <= days[6];
  const add = (s, e, picked) => {
    if(!s || !s.name || seen.has(s.name)) return;
    seen.add(s.name);
    const prem = e.number === 1;
    out.push({
      name: s.name,
      ep: e.season ? (prem ? `الموسم ${ar(e.season)}` : `الموسم ${ar(e.season)} · ح ${ar(e.number)}`) : '',
      date: e.airdate || '',
      rating: (s.rating && s.rating.average) || 0,
      prem, picked
    });
  };

  // shows picked one by one: their next episode, if it airs this week
  const picked = await Promise.all(F.ids.map(id => getJSON(`https://api.tvmaze.com/shows/${id}?embed=nextepisode`, null)));
  picked.forEach(s => {
    const e = s && s._embedded && s._embedded.nextepisode;
    if(e && inWeek(e.airdate)) add(s, e, true);
  });

  // the schedule, narrowed by genre and language; skipped when only picked shows were chosen
  if(!F.ids.length || F.genres.length || F.langs.length){
    const lists = await Promise.all(days.flatMap(dt => [
      getJSON(`https://api.tvmaze.com/schedule/web?date=${dt}`, []),
      ...F.countries.map(c => getJSON(`https://api.tvmaze.com/schedule?country=${encodeURIComponent(c)}&date=${dt}`, []))
    ]));
    lists.flat().forEach(e => {
      const s = e.show || (e._embedded && e._embedded.show) || {};
      if(s.type && SKIP_TYPES.includes(s.type)) return;
      if(s.genres && s.genres.includes('Soap')) return;   // no daytime soaps
      if(!e.number || e.number < 1) return;
      if(e.season && e.season > 15) return;               // keep it to real series
      if(((s.rating && s.rating.average) || 0) < F.minRating) return;
      if(F.genres.length && !(s.genres || []).some(g => F.genres.includes(g))) return;
      if(F.langs.length && !F.langs.includes(s.language)) return;
      add(s, e, false);
    });
  }

  // nothing answered (offline): keep the saved list if one is shown
  if(NET_OK === answered && document.querySelector('#week-list li:not(.empty)')) return;
  if(out.length){                                   // keep the last good list on a failed refresh
    WEEK_POOL = out.sort((a,b)=> (b.picked - a.picked) || (b.prem - a.prem) || a.date.localeCompare(b.date)).slice(0, 50);
    WEEK_PAGE = 0;
  }
  renderPanel(false);
}

let WIRD_TURN = 0, WIRD_PAGES = {};
async function wirdLoad(page){
  if(WIRD_PAGES[page]) return WIRD_PAGES[page];
  try{ const c = JSON.parse(localStorage.getItem('wird:' + page) || 'null'); if(c){ WIRD_PAGES[page] = c; return c; } }catch(e){}
  const j = await getJSON(`https://api.alquran.cloud/v1/page/${page}/quran-simple`, null);
  const a = j && j.data && j.data.ayahs;
  if(!a || !a.length) return null;
  const v = a.map(x => ({s: x.surah.number, n: x.numberInSurah, name: x.surah.name, t: x.text}));
  WIRD_PAGES[page] = v;
  try{ localStorage.setItem('wird:' + page, JSON.stringify(v)); }catch(e){}
  return v;
}
function wirdState(){
  const w = CTRL.wird || {}, per = Math.min(20, Math.max(1, +w.perDay || 1));
  const page = Math.min(604, Math.max(1, +w.page || 1));
  const doneToday = w.lastDone === todayKey();
  return {per, page, doneToday, pages: Array.from({length: per}, (_, i) => page + i).filter(x => x <= 604)};

const BASMALA = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
function wirdParts(st){
  const ayahs = st.pages.flatMap(p => WIRD_PAGES[p] || []);
  const parts = [];
  let cur = [], len = 0;
  ayahs.forEach(a => {
    const L = a.t.length + (a.n === 1 ? 60 : 0);
    if(cur.length && len + L > 420){ parts.push(cur); cur = []; len = 0; }
    cur.push(a); len += L;
  });
  if(cur.length) parts.push(cur);
  return parts;
}
function wirdSlide(){
  if(+(CTRL.wird || {}).page > 604) return {title: 'الورد اليومي', rows: ['<li class="wd"><b>ختمتم القرآن الكريم 🤲</b><span>تقبل الله منكم · ابدأ ختمة جديدة من الجوال</span></li>']};
  const st = wirdState(), pct = Math.round((st.page - 1) / 604 * 100);
  const prog = `<li class="wp"><span>الختمة ${ar(pct)}٪</span><span class="bar"><i style="width:${pct}%"></i></span><span>ص ${ar(st.page)} من ٦٠٤</span></li>`;
  if(st.doneToday)
    return {title: 'الورد اليومي', rows: [`<li class="wd"><b>✓ تم ورد اليوم</b><span>تقبل الله منكم · ورد الغد من صفحة ${ar(st.page)}</span></li>`, prog]};
  st.pages.forEach(p => { if(!WIRD_PAGES[p]) wirdLoad(p).then(v => { if(v) renderPanel(false); }); });
  const parts = wirdParts(st);
  if(!parts.length) return {title: 'الورد اليومي', rows: [`<li class="empty">جارٍ تحميل صفحة ${ar(st.page)}…</li>`, prog]};
  const k = WIRD_TURN % parts.length, part = parts[k], rows = [];
  let text = '';
  part.forEach(a => {
    let t = a.t;
    if(a.n === 1){
      if(text){ rows.push(`<li class="quote wird">${text}</li>`); text = ''; }
      rows.push(`<li class="sh">${esc(a.name)}</li>`);
      if(a.s !== 1 && a.s !== 9 && t.startsWith(BASMALA)){ rows.push(`<li class="sh">${BASMALA}</li>`); t = t.slice(BASMALA.length).trim(); }

  return {title: `الورد اليومي · ${range}${parts.length > 1 ? ` · ${ar(k + 1)}/${ar(parts.length)}` : ''}`, rows};
}

function setCardTitle(hd, title){
  const hit = CARD_ICONS.find(([re]) => re.test(title));
  let svg = '';
  if(hit) svg = hit[1] === null ? svgIcon(wxIcon(WX_NOW != null && WX_NOW !== 'dust' ? WX_NOW : (FORECAST[0] || {}).code, isNight()))
                                : `<svg class="wx-ic" viewBox="0 0 24 24">${hit[1]}</svg>`;
  hd.innerHTML = (svg ? `<span class="hd-ic">${svg}</span>` : '') + esc(title);
}

function renderPanel(animate){
  const ul = document.getElementById('week-list'), hd = document.getElementById('week-hd');
  const P = CONFIG.panel;
  ul.classList.remove('match-grid');
  if(ROTATES()){ const q = rotatingCard(); setCardTitle(hd, q.title); ul.innerHTML = q.rows.join(''); ul.classList.toggle('match-grid',!!ul.querySelector('.match-cell')); if(!ul.classList.contains('match-grid'))fitCard(ul); return; }
  if(P === 'shows'){ renderWeekPage(animate); return; }
  let rows = [];
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'matches'){rows=matchCard();ul.classList.add('match-grid');}
  else if(P === 'home'){ setCardTitle(hd, 'الصلاة القادمة'); ul.innerHTML = homeRows().join(''); return; }
  else if(P === 'verse'){ const q = CONFIG.widget ? quoteOfDay() : rotatingCard(); setCardTitle(hd, q.title); rows = q.rows; ul.innerHTML = rows.join(''); ul.classList.toggle('match-grid',!!ul.querySelector('.match-cell')); if(!ul.classList.contains('match-grid'))fitCard(ul); return; }
  if(PANEL_TITLE[P]) setCardTitle(hd, PANEL_TITLE[P]);
  if(!rows.length){
    ul.classList.remove('flip');
    ul.innerHTML = `<li class="empty">${P === 'matches' ? 'لا مباريات هذا الأسبوع' : 'لا تتوفر بيانات الآن'}</li>`;
    return;
  }
  if(P === 'matches' && rows.length > WEEK_ROWS){        // page through, like the shows
    const start = (LIST_PAGE * WEEK_ROWS) % rows.length;
    rows = Array.from({length: WEEK_ROWS}, (_, i) => rows[(start + i) % rows.length]);
  }
  ul.innerHTML = rows.join('');
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  let next = null;
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const at = h * 60 + mi;
    let cls = at < now ? 'past' : '';
    if(at >= now && !next){ next = k; cls = 'next'; }
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmt12(h, mi)}</span></li>`;
  });
}

// weather card: today large (icon, condition, high and low), the next four days small underneath
function forecastRows(){
  if(!FORECAST.length) return [];
  const t = FORECAST[0];
  const dayName = d => IDF(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
  const hero = `<li class="wx-hero"><span class="big-ic">${svgIcon(wxIcon(WX_NOW != null && WX_NOW !== 'dust' ? WX_NOW : t.code, isNight()))}</span>`
    + `<span class="wx-today"><b>${esc(document.getElementById('wx-temp').textContent)} · ${esc(document.getElementById('wx-desc').textContent || WX_CODES[t.code] || '')}</b><small>${esc(CONFIG.city)}</small></span>`
    + `<span class="wx-hl"><span><small>العظمى</small>${ar(Math.round(t.hi))}°</span><span class="lo"><small>الصغرى</small>${ar(Math.round(t.lo))}°</span></span></li>`;
  const days = FORECAST.slice(1, 5).map((d, i) =>
    `<span class="wx-d"><b>${i === 0 ? 'غداً' : dayName(d)}</b>${svgIcon(wxIcon(d.code, false))}`
    + `<span>${ar(Math.round(d.hi))}° <i>/</i> ${ar(Math.round(d.lo))}°</span></span>`).join('');
  return [hero, `<li class="wx-days">${days}</li>`];
}

// matches card: results first (the winner bright, the loser faded), then what is still to be played
function matchCard(){
  const now = Date.now(), seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  TEAM_FIX.forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  const today = IDF('en-CA', {timeZone:CONFIG.timezone}).format(new Date());
  const items = evs.map(ev => ({ev, t: toDate(ev).getTime()}))
    .filter(x => finishedRecently(x.ev, now)
      || (now < x.t + 2.5*3600000 && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort((a, b) => a.t - b.t);
  const done = items.filter(x => finishedRecently(x.ev, now)).slice(-2);
  const rest = items.filter(x => !finishedRecently(x.ev, now));
  const all=[...done.slice(-1),...rest];
  MATCH_PAGES=Math.max(1,Math.ceil(all.length/4));
  return all.slice((MATCH_CARD_PAGE%MATCH_PAGES)*4,(MATCH_CARD_PAGE%MATCH_PAGES)*4+4).map(x=>`<li class="match-cell">${todaySlot({...x,lg:leagueAr(x.ev)},now)}</li>`);
}

let MATCH_CARD_PAGE = 0, MATCH_PAGES = 1;

// every followed team's games this week, plus results from the last day, in time order
function matchRows(){
  const now = Date.now(), seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  const day = d => IDF(GREG, {timeZone:CONFIG.timezone, weekday:'long'}).format(d);
  const today = IDF('en-CA', {timeZone:CONFIG.timezone}).format(new Date());
  return evs.map(ev => ({ev, t: toDate(ev).getTime()}))
    .filter(x => finishedRecently(x.ev, now)
      || (now < x.t + 2.5*3600000 && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort((a, b) => a.t - b.t)
    .map(({ev, t}) => {
      const d = new Date(t), scored = ev.intHomeScore != null && ev.intAwayScore != null;
      const mid = scored && now >= t ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
      const p = IDF('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
        .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
      const when = finishedRecently(ev, now) ? 'انتهت'
        : now >= t ? '<span class="live">مباشر'+matchMinute(ev)+'</span>'
        : (IDF('en-CA', {timeZone:CONFIG.timezone}).format(d) === today ? 'اليوم' : day(d))
          + ' ' + fmt12(+p.hour % 24, +p.minute);
      return `<li><span>${homeSide(ev)}${mid}${awaySide(ev)}</span><span class="dt">${when}</span></li>`;
    });
}

"سورة يونس", "ayah": 62}, {"text": "وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ إِلَّا عَلَى اللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا كُلٌّ فِي كِتَابٍ مُبِينٍ", "surah": "سورة هود", "ayah": 6}, {"text": "وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ذَٰلِكَ ذِكْرَىٰ لِلذَّاكِرِينَ", "surah": "سورة هود", "ayah": 114}, {"text": "وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ", "surah": "سورة هود", "ayah": 115}, {"text": "قَالَ إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ", "surah": "سورة يوسف", "ayah": 86}, {"text": "يَا بَنِيَّ اذْهَبُوا فَتَحَسَّسُوا مِنْ يُوسُفَ وَأَخِيهِ وَلَا تَيْأَسُوا مِنْ رَوْحِ اللَّهِ إِنَّهُ لَا يَيْأَسُ مِنْ رَوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ", "surah": "سورة يوسف", "ayah": 87}, {"text": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ", "surah": "سورة إبراهيم", "ayah": 40}, {"text": "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", "surah": "سورة إبراهيم", "ayah": 41}, {"text": "نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ", "surah": "سورة الحجر", "ayah": 49}, {"text": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُنْ مِنَ السَّاجِدِينَ", "surah": "سورة الحجر", "ayah": 98}, {"text": "وَإِنْ تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا إِنَّ اللَّهَ لَغَفُورٌ رَحِيمٌ", "surah": "سورة النحل", "ayah": 18}, {"text": "إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ وَيَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَالْبَغْيِ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ", "surah": "سورة النحل", "ayah": 90}, {"text": "مَنْ عَمِلَ صَالِحًا مِنْ ذَكَرٍ أَوْ أُنْثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً وَلَنَجْزِيَنَّهُمْ أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 97}, {"text": "وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "surah": "سورة الإسراء", "ayah": 24}, {"text": "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا", "surah": "سورة الإسراء", "ayah": 82}, {"text": "إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", "surah": "سورة الكهف", "ayah": 10}, {"text": "قَالَ لَا تَخَافَا إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ", "surah": "سورة طه", "ayah": 46}, {"text": "فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ وَلَا تَعْجَلْ بِالْقُرْآنِ مِنْ قَبْلِ أَنْ يُقْضَىٰ إِلَيْكَ وَحْيُهُ وَقُلْ رَبِّ زِدْنِي عِلْمًا", "surah": "سورة طه", "ayah": 114}, {"text": "وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا لَا نَسْأَلُكَ رِزْقًا نَحْنُ نَرْزُقُكَ وَالْعَاقِبَةُ لِلتَّقْوَىٰ", "surah": "سورة طه", "ayah": 132}, {"text": "وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة الأنبياء", "ayah": 83}, {"text": "وَذَا النُّونِ إِذْ ذَهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَنْ نَقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "surah": "سورة الأنبياء", "ayah": 87}, {"text": "وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ", "surah": "سورة المؤمنون", "ayah": 118}, {"text": "وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ وَكَفَىٰ بِهِ بِذُنُوبِ عِبَادِهِ خَبِيرًا", "surah": "سورة الفرقان", "ayah": 58}, {"text": "وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا", "surah": "سورة الفرقان", "ayah": 63}, {"text": "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", "surah": "سورة الشعراء", "ayah": 80}, {"text": "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", "surah": "سورة الشعراء", "ayah": 83}, {"text": "أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الْأَرْضِ أَإِلَٰهٌ مَعَ اللَّهِ قَلِيلًا مَا تَذَكَّرُونَ", "surah": h": 155}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ", "surah": "سورة البقرة", "ayah": 183}, {"text": "حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ", "surah": "سورة البقرة", "ayah": 238}, {"text": "مَنْ ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة البقرة", "ayah": 245}, {"text": "قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ صَدَقَةٍ يَتْبَعُهَا أَذًى وَاللَّهُ غَنِيٌّ حَلِيمٌ", "surah": "سورة البقرة", "ayah": 263}, {"text": "الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 274}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 277}, {"text": "وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ", "surah": "سورة البقرة", "ayah": 280}, {"text": "رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَا رَيْبَ فِيهِ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 9}, {"text": "الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ", "surah": "سورة آل عمران", "ayah": 16}, {"text": "قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ وَتُعِزُّ مَنْ تَشَاءُ وَتُذِلُّ مَنْ تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة آل عمران", "ayah": 26}, {"text": "هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُ قَالَ رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ", "surah": "سورة آل عمران", "ayah": 38}, {"text": "رَبَّنَا آمَنَّا بِمَا أَنْزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", "surah": "سورة آل عمران", "ayah": 53}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ", "surah": "سورة آل عمران", "ayah": 102}, {"text": "وَلْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ", "surah": "سورة آل عمران", "ayah": 104}, {"text": "وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِنْ رَبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ", "surah": "سورة آل عمران", "ayah": 133}, {"text": "وَالَّذِينَ إِذَا فَعَلُوا فَاحِشَةً أَوْ ظَلَمُوا أَنْفُسَهُمْ ذَكَرُوا اللَّهَ فَاسْتَغْفَرُوا لِذُنُوبِهِمْ وَمَنْ يَغْفِرُ الذُّنُوبَ إِلَّا اللَّهُ وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ", "surah": "سورة آل عمران", "ayah": 135}, {"text": "وَمَا كَانَ قَوْلَهُمْ إِلَّا أَنْ قَالُوا رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "surah": "سورة آل عمران", "ayah": 147}, {"text": "إِنْ يَنْصُرْكُمُ اللَّهُ فَلَا غَالِبَ لَكُمْ وَإِنْ يَخْذُلْكُمْ فَمَنْ ذَا الَّذِي يَنْصُرُكُمْ مِنْ بَعْدِهِ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ", "surah": "سورة آل عمران", "ayah": 160}, {"text": "رَبَّنَا وَآتِنَا مَا وَعَدْتَنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 194}, {"text": "إِنْ تَجْتَنِبُوا كَبَائِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَنُدْخِلْكُمْ مُدْخَلًا كَرِيمًا", "surah": "سورة النساء", "ayah": 31}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ وَإِنْ تَكُ حَسَنَةً يُضَاعِفْهَا وَيُؤْتِ مِنْ لَدُنْهُ أَجْرًا عَظِيمًا", "surah": "سورة النساء", "ayah": 40}, {"text": "مَا يَفْعَلُ اللَّهُ بِعَذَابِكُمْ إِنْ شَكَرْتُمْ وَآمَنْتُمْ وَكَانَ اللَّهُ شَاكِرًا عَلِيمًا", "surah": "سورة النساء", "ayah": 147}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ وَجَاهِدُوا فِي سَبِيلِهِ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة المائـدة", "ayah": 35}, {"text": "وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ وَإِنْ يَمْسَسْكَ بِخَيْرٍ فَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة الأنعام", "ayah": 17}, {"text": "وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا لَعِبٌ وَلَهْوٌ وَلَلدَّارُ الْآخِرَةُ خَيْرٌ لِلَّذِينَ يَتَّقُونَ أَفَلَا تَعْقِلُونَ", "surah": "سورة الأنعام", "ayah": 32}, {"text": "لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ", "surah": "سورة الأنعام", "ayah": 103}, {"text": "مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا وَمَنْ جَاءَ بِالسَّيِّئَةِ فَلَا يُجْزَىٰ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَ", "surah": "سورة الأنعام", "ayah": 160}, {"text": "يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ", "surah": "سورة الأعراف", "ayah": 31}, {"text": "ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ", "surah": "سورة الأعراف", "ayah": 55}, {"text": "وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ سَيُجْزَوْنَ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة الأعراف", "ayah": 180}, {"text": "إِنَّ الَّذِينَ اتَّقَوْا إِذَا مَسَّهُمْ طَائِفٌ مِنَ الشَّيْطَانِ تَذَكَّرُوا فَإِذَا هُمْ مُبْصِرُونَ", "surah": "سورة الأعراف", "ayah": 201}, {"text": "وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنْصِتُوا لَعَلَّكُمْ تُرْحَمُونَ", "surah": "سورة الأعراف", "ayah": 204}, {"text": "إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": "سورة الأنفال", "ayah": 2}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ تَتَّقُوا اللَّهَ يَجْعَلْ لَكُمْ فُرْقَانًا وَيُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَيَغْفِرْ لَكُمْ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ", "surah": "سورة الأنفال", "ayah": 29}, {"text": "وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ وَسَتُرَدُّونَ إِلَىٰ عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ", "surah": "سورة التوبة", "ayah": 105}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ", "surah": "سورة التوبة", "ayah": 119}, {"text": "لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ", "surah": "سورة التوبة", "ayah": 128}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ يَهْدِيهِمْ رَبُّهُمْ بِإِيمَانِهِمْ تَجْرِي مِنْ تَحْتِهِمُ الْأَنْهَارُ فِي جَنَّاتِ النَّعِيمِ", "surah": "سورة يونس", "ayah": 9}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ النَّاسَ شَيْئًا وَلَٰكِنَّ النَّاسَ أَنْفُسَهُمْ يَظْلِمُونَ", "surah": "سورة يونس", "ayah": 44}, {"text": "يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ", "surah": "سورة يونس", "ayah": 57}, {"text": "قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ", "surah": "سورة يونس", "ayah": 58}, {"text": "وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ إِنَّ رَبِّي رَحِيمٌ وَدُودٌ", "surah": "سورة هود", "ayah": 90}, {"text": "وَمَا أُبَرِّئُ نَفْسِي إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلَّا مَا رَحِمَ رَبِّي إِنَّ رَبِّي غَفُورٌ رَحِيمٌ", "surah": "سورة يوسف", "ayah": 53}, {"text": "قَالَ لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ وَهُوَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة يوسف", "ayah": 92}, {"text": "الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ طُوبَىٰ لَهُمْ وَحُسْنُ مَآبٍ", "surah": "سورة الرعد", "ayah": 29}, {"text": "يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ وَعِنْدَهُ أُمُّ الْكِتَابِ", "surah": "سورة الرعد", "ayah": 39}, {"text": "أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ", "surah": "سورة إبراهيم", "ayah": 24}, {"text": "وَآتَاكُمْ مِنْ كُلِّ مَا سَأَلْتُمُوهُ وَإِنْ تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا إِنَّ الْإِنْسَانَ لَظَلُومٌ كَفَّارٌ", "surah": "سورة إبراهيم", "ayah": 34}, {"text": "هَٰذَا بَلَاغٌ لِلنَّاسِ وَلِيُنْذَرُوا بِهِ وَلِيَعْلَمُوا أَنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ وَلِيَذَّكَّرَ أُولُو الْأَلْبَابِ", "surah": "سورة إبراهيم", "ayah": 52}, {"text": "إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ", "surah": "سورة الحجر", "ayah": 9}, {"text": "وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ", "surah": "سورة الحجر", "ayah": 99}, {"text": "وَمَا بِكُمْ مِنْ نِعْمَةٍ فَمِنَ اللَّهِ ثُمَّ إِذَا مَسَّكُمُ الضُّرُّ فَإِلَيْهِ تَجْأَرُونَ", "surah": "سورة النحل", "ayah": 53}, {"text": "مَا عِنْدَكُمْ يَنْفَدُ وَمَا عِنْدَ اللَّهِ بَاقٍ وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 96}, {"text": "فَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا وَاشْكُرُوا نِعْمَتَ اللَّهِ إِنْ كُنْتُمْ إِيَّاهُ تَعْبُدُونَ", "surah": "سورة النحل", "ayah": 114}, {"text": "ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة النحل", "ayah": 125}, {"text": "وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِي ضَيْقٍ مِمَّا يَمْكُرُونَ", "surah": "سورة النحل", "ayah": 127}, {"text": "إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا", "surah": "سورة الإسراء", "ayah": 9}, {"text": "وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُمْ مَشْكُورًا", "surah": "سورة الإسراء", "ayah": 19}, {"text": "وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا", "surah": "سورة الإسراء", "ayah": 36}, {"text": "وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّكَ لَنْ تَخْرِقَ الْأَرْضَ وَلَنْ تَبْلُغَ الْجِبَالَ طُولًا", "surah": "سورة الإسراء", "ayah": 37}, {"text": "وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ إِنَّ الشَّيْطَانَ يَنْزَغُ بَيْنَهُمْ إِنَّ الشَّيْطَانَ كَانَ لِلْإِنْسَانِ عَدُوًّا مُبِينًا", "surah": "سورة الإسراء", "ayah": 53}, {"text": "وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَىٰ كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلًا", "surah": "سورة الإسراء", "ayah": 70}, {"text": "قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا", "surah": "سورة الإسراء", "ayah": 84}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا", "surah": "سورة الكهف", "ayah": 30}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا", "surah": "سورة الكهف", "ayah": 107}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَيَجْعَلُ لَهُمُ الرَّحْمَٰنُ وُدًّا", "surah": "سورة مريم", "ayah": 96}, {"text": "مَا أَنْزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَىٰ", "surah": "سورة طه", "ayah": 2}, {"text": "إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي", "surah": "سورة طه", "ayah": 14}, {"text": "وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ", "surah": "سورة طه", "ayah": 82}, {"text": "كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ وَنَبْلُوكُمْ بِالشَّرِّ وَالْخَيْرِ فِتْنَةً وَإِلَيْنَا تُرْجَعُونَ", "surah": "سورة الأنبياء", "ayah": 35}, {"text": "وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ", "surah": "سورة الأنبياء", "ayah": 107}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا وَاعْبُدُوا رَبَّكُمْ وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة الحج", "ayah": 77}, {"text": "قَدْ أَفْلَحَ الْمُؤْمِنُونَ", "surah": "سورة المؤمنون", "ayah": 1}, {"text": "الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ", "surah": "سورة المؤمنون", "ayah": 2}, {"text": "وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُعْرِضُونَ", "surah": "سورة المؤمنون", "ayah": 3}, {"text": "أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ", "surah": "سورة المؤمنون", "ayah": 115}, {"text": "وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ وَيَخْشَ اللَّهَ وَيَتَّقْهِ فَأُولَٰئِكَ هُمُ الْفَائِزُونَ", "surah": "سورة النور", "ayah": 52}, {"text": "وَالَّذِينَ لَا يَشْهَدُونَ الزُّورَ وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا", "surah": "سورة الفرقان", "ayah": 72}, {"text": "أُولَٰئِكَ يُجْزَوْنَ الْغُرْفَةَ بِمَا صَبَرُوا وَيُلَقَّوْنَ فِيهَا تَحِيَّةً وَسَلَامًا", "surah": "سورة الفرقان", "ayah": 75}, {"text": "الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ", "surah": "سورة الشعراء", "ayah": 78}, {"text": "وَالَّذِي هُوَ يُطْعِمُنِي وَيَسْقِينِ", "surah": "سورة الشعراء", "ayah": 79}, {"text": "وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ", "surah": "سورة الشعراء", "ayah": 82}, {"text": "يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ", "surah": "سورة الشعراء", "ayah": 88}, {"text": "وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ", "surah": "سورة الشعراء", "ayah": 217}, {"text": "إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة القصص", "ayah": 56}, {"text": "وَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَزِينَتُهَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ أَفَلَا تَعْقِلُونَ", "surah": "سورة القصص", "ayah": 60}, {"text": "تِلْكَ الدَّارُ الْآخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِي الْأَرْضِ وَلَا فَسَادًا وَالْعَاقِبَةُ لِلْمُتَّقِينَ", "surah": "سورة القصص", "ayah": 83}, {"text": "أَحَسِبَ النَّاسُ أَنْ يُتْرَكُوا أَنْ يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ", "surah": "سورة العنكبوت", "ayah": 2}, {"text": "وَمَنْ جَاهَدَ فَإِنَّمَا يُجَاهِدُ لِنَفْسِهِ إِنَّ اللَّهَ لَغَنِيٌّ عَن ": "سورة الصافات", "ayah": 181}, {"text": "وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة الصافات", "ayah": 182}, {"text": "الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ", "surah": "سورة الزمر", "ayah": 18}, {"text": "وَأَنِيبُوا إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا لَهُ مِنْ قَبْلِ أَنْ يَأْتِيَكُمُ الْعَذَابُ ثُمَّ لَا تُنْصَرُونَ", "surah": "سورة الزمر", "ayah": 54}, {"text": "يَا قَوْمِ إِنَّمَا هَٰذِهِ الْحَيَاةُ الدُّنْيَا مَتَاعٌ وَإِنَّ الْآخِرَةَ هِيَ دَارُ الْقَرَارِ", "surah": "سورة غافر", "ayah": 39}, {"text": "هُوَ الْحَيُّ لَا إِلَٰهَ إِلَّا هُوَ فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة غافر", "ayah": 65}, {"text": "إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا تَتَنَزَّلُ عَلَيْهِمُ الْمَلَائِكَةُ أَلَّا تَخَافُوا وَلَا تَحْزَنُوا وَأَبْشِرُوا بِالْجَنَّةِ الَّتِي كُنْتُمْ تُوعَدُونَ", "surah": "سورة فصلت", "ayah": 30}, {"text": "وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا وَقَالَ إِنَّنِي مِنَ الْمُسْلِمِينَ", "surah": "سورة فصلت", "ayah": 33}, {"text": "مَنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ وَمَنْ أَسَاءَ فَعَلَيْهَا وَمَا رَبُّكَ بِظَلَّامٍ لِلْعَبِيدِ", "surah": "سورة فصلت", "ayah": 46}, {"text": "فَاطِرُ السَّمَاوَاتِ وَالْأَرْضِ جَعَلَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا وَمِنَ الْأَنْعَامِ أَزْوَاجًا يَذْرَؤُكُمْ فِيهِ لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ", "surah": "سورة الشورى", "ayah": 11}, {"text": "وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ وَيَعْفُو عَنِ السَّيِّئَاتِ وَيَعْلَمُ مَا تَفْعَلُونَ", "surah": "سورة الشورى", "ayah": 25}, {"text": "وَمَا أَصَابَكُمْ مِنْ مُصِيبَةٍ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُو عَنْ كَثِيرٍ", "surah": "سورة الشورى", "ayah": 30}, {"text": "فَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ لِلَّذِينَ آمَنُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": " function quoteOfDay(){
  const n = riyadhDayNumber(), half = Math.floor(n / 2);
  return VERSES.length && n % 2 === 0 ? verseOfDay(half) : hadithOfDay(half);
}
function verseOfDay(k){
  const v = VERSES[k % VERSES.length];
  return {title:'آية اليوم', rows:[`<li class="quote"><span class="orn">﴿</span>${esc(v.text)}<span class="orn">﴾</span></li>`, `<li class="src">${esc(v.surah)} · ${ar(v.ayah)}</li>`]};
}
function hadithOfDay(k){
  const h = HADITH[k % HADITH.length];
  const saw = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
  const body = h.parts.map(([k, t]) => k === 'q' ? `«${saw(esc(t))}»` : `<span class="nar">${saw(esc(t))}</span>`).join(' ');
  return {title:'حديث اليوم', rows:[`<li class="quote hadith">${body}</li>`, `<li class="src">${esc(h.source)}</li>`]};
}

const WX_CODES = {
  0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
  80:'زخات خفيفة',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',
  95:'عواصف رعدية',96:'عواصف مصحوبة ببرد',99:'عواصف قوية'
};
async function loadWeather(){
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,weather_code`
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=5`, 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    document.getElementById('wx-temp').textContent = ar(Math.round(j.current.temperature_2m)) + '°';
    const d = document.getElementById('wx-desc');
    d.textContent = WX_CODES[j.current.weather_code] || '';
    d.classList.remove('dust');
    WX_NOW = j.current.weather_code; paintWeatherIcon(); DUST_PM = 0; renderAlerts();
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    document.getElementById('wx-range').textContent =
      (hi != null && lo != null) ? `العظمى ${ar(Math.round(hi))}° · الصغرى ${ar(Math.round(lo))}°` : '';
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i]})).filter(x => x.hi != null && x.lo != null);
    if(CONFIG.panel === 'forecast') renderPanel(false);
  }catch(e){ return; }   // keep the last reading; with none only the city shows

  // dust overrides the condition word: PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    const pm = Math.max(c.pm10 || 0, c.dust || 0);
    if(pm >= 150){
      const d = document.getElementById('wx-desc');
      d.textContent = pm >= 400 ? 'غبار كثيف' : 'غبار';
      d.classList.add('dust');
      WX_NOW = 'dust'; paintWeatherIcon(); DUST_PM = pm; renderAlerts();
    }
  }catch(e){}
}

// sleep mode: from midnight until Fajr only a dim clock and the date, nothing else moving or bright
// sleep mode: the hours come from the phone page (default: midnight until Fajr); it may span midnight
const hm2m = (s, d) => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1]*60 + +m[2] : d; };
function applySleep(){
  const sl = (typeof CTRL !== 'undefined' && CTRL.sleep) || {};
  const p = riyadhParts(), m = p.h*60 + p.mi;
  const from = hm2m(sl.from, 0), to = hm2m(sl.to, minutesOf('Fajr', 4*60+30));
  const inside = from <= to ? (m >= from && m < to) : (m >= from || m < to);
  document.documentElement.classList.toggle('sleep', !CONFIG.widget && !sl.off && inside);
}
// night dimming: transparent by day, dark after 21:00 and before 07:00
function applyNight(){
  applySleep();
  const p = riyadhParts();
  const h = p.h + p.mi/60;
  const MAX = 0.46;
  let o = 0;
  if(h >= 23 || h < 5)      o = MAX;
  else if(h >= 21)          o = MAX * (h - 21) / 2;
  else if(h < 7)            o = MAX * (7 - h) / 2;
  const el = document.getElementById('dimmer');
  if(el) el.style.opacity = Math.max(0, Math.min(MAX, o)).toFixed(2);
}

// gentle pixel shift so static text never burns into the panel
const SHIFT_SEQ = [[0,0],[3,2],[0,4],[-3,2],[-3,-2],[0,-4],[3,-2]];
let shiftTick = 0;
function pixelShift(){
  shiftTick = (shiftTick + 1) % SHIFT_SEQ.length;
  const [dx,dy] = SHIFT_SEQ[shiftTick];
  const st = document.querySelector('.stage');
  if(st) st.style.transform = `translate(${dx}px,${dy}px)`;
  document.querySelectorAll('.bottom > * > .v2-section-title').forEach(el=>el.style.transform=`translate(${-dx}px,${-dy}px)`);
}

async function loadPhotoIndex(){
  try{
    const r = await fetchT(PHOTO_BASE + 'index.json', 15000);
    if(!r.ok) return;
    const list = (await r.json()).filter(p => p && p.f);
    if(list.length){
      REMOTE_BGS = list;
      try{ localStorage.setItem('photoIndex', JSON.stringify(list)); }catch(e){}
    }
  }catch(e){}
}

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  ph.classList.remove('settle'); void ph.offsetWidth; ph.classList.add('settle');
  const cr = document.getElementById('credit');
  // the caption, then the source; «نيوم» in the caption already says NEOM
  const src = b.t && /نيوم/.test(b.t) ? String(b.c || '').replace(/^NEOM · /, '') : b.c;
  if(cr) cr.textContent = [b.t, src].filter(Boolean).join(' · ');
}

// Every 2 days a new random set of 8 hosted photos (Park-Miller generator seeded
// by the 2-day period), rotating every 30 minutes; by night only photos tagged n (sunsets, night skies).
// Only the photo on screen is downloaded.
const PHOTO_SET = 8, PHOTO_PERIOD_DAYS = 2;   // the change interval: photoMin(), 30 by default
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
let BG_SLOT = -1, PREFETCHED = false;
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slot = riyadhDayNumber() * (1440 / photoMin()) + Math.floor((p.h * 60 + p.mi) / photoMin());
    const key = slot + (isNight() ? 'n' : 'd');
    if(key === BG_SLOT && !force) return;
    BG_SLOT = key;
    const night = isNight(), tagged = REMOTE_BGS.filter(b => !!b.n === night);
    const pool = tagged.length >= 3 ? tagged : REMOTE_BGS;
    const set = pool.length ? photoSet(pool.length).map(k => pool[k]) : [];
    const local = BGS[slot % BGS.length];
    if(!set.length){ showBackground(local.u, local); return; }
    const b = set[slot % set.length], url = PHOTO_BASE + b.f;
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // fetch the rest of the set once, quietly, so the app has each one on disk before its turn
    if(!PREFETCHED){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

// Last painted panels, shown at once on the next start while fresh data loads.
const SNAP_KEY = 'snap-v2-r9:' + location.hash;   // bump when the panels' markup changes
const SNAP_SEL = ['#pt-strip', '#week-list', '#match-row'];
function saveSnap(){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(SNAP_SEL.map(q => (document.querySelector(q)||{}).innerHTML || ''))); }catch(e){}
}
function restoreSnap(){
  try{
    const v = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if(v) SNAP_SEL.forEach((q, i) => { const el = document.querySelector(q); if(el && v[i]) el.innerHTML = v[i]; });
  }catch(e){}
}

function weatherDock(){
 if(!FORECAST.length)return '<div class="weather-wait">جارٍ تحديث الطقس</div>';
 const today=FORECAST[0], desc=document.getElementById('wx-desc').textContent || WX_CODES[today.code] || '';
 const current=`<div class="weather-current"><div class="weather-now">${svgIcon(wxIcon(WX_NOW!=null?WX_NOW:today.code,isNight()))}<b>${esc(document.getElementById('wx-temp').textContent)}</b></div><div class="weather-condition">${esc(desc)}</div><small>${esc(CONFIG.city)}</small><div class="weather-highlow">العظمى ${ar(Math.round(today.hi))}° · الصغرى ${ar(Math.round(today.lo))}°</div></div>`;
 const days=FORECAST.slice(1,5).map((d,i)=>`<div class="weather-day"><b>${i===0?'غداً':esc(IDF(GREG,{timeZone:'UTC',weekday:'long'}).format(new Date(d.date+'T12:00:00Z')))}</b>${svgIcon(wxIcon(d.code,false))}<span>${ar(Math.round(d.hi))}° <small>/ ${ar(Math.round(d.lo))}°</small></span></div>`).join('');
 return current+'<div class="weather-days">'+days+'</div>';
}
function renderV2(){
  softHTML(document.getElementById('v2-forecast'), weatherDock());

  const sc = SCREEN();
  const kids = GUEST() || !cardOn('stars') ? [] : KIDS().filter(k => sc.id === 'family' || k.id === sc.id);
  softHTML(document.getElementById('v2-kids'), kids.length ? '<h2>نجوم أبطال عائلتي</h2><div class="kids-grid">' + kids.map(k => `<div class="kid-card"><span class="kid-star">★</span><b>${esc(k.name)}</b><span class="kid-total">${ar(Math.max(0,+k.stars || 0))}<small>نجمة</small></span></div>`).join('') + '</div>' : '');
  const all = GUEST() || !cardOn('series') ? [] : seriesItems();
  const page=all.length ? Math.floor(Date.now()/15000)%Math.ceil(all.length/2) : 0;
  const shown=all.slice(page*2,page*2+2);
  document.querySelector('.v2-series').style.visibility = GUEST() || !cardOn('series') ? 'hidden' : '';
  softHTML(document.getElementById('v2-series'), shown.length ? shown.map(it=> `<div class="v2-show"><div class="series-poster">${it.poster ? `<img src="${esc(it.poster)}" alt="" onerror="this.style.display='none'">` : '🎬'}</div><div class="series-copy"><b>${esc(it.name)}</b>${whenText(it,Date.now())}</div></div>`).join('') : '<span class="sub">لا توجد تحديثات حالياً</span>');
}
function boot(){
  if(_Q.get('home') === '1') document.documentElement.classList.add('home-dashboard');
  setInterval(renderV2,1000);

  if(CONFIG.widget){ bootWidget(); return; }
  restoreSnap();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  const cs = document.getElementById('clock-sub');
  if(cs) cs.textContent = 'بتوقيت ' + CONFIG.city.split(/\s+[-–]\s+|،/)[0].trim();
  document.title = 'YourTV V2 · توزيع 10';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  document.querySelector('.clock-face').insertAdjacentHTML('beforeend', watchSVG());
  fitWatch(); addEventListener('resize', fitWatch);
  if(window.ResizeObserver) new ResizeObserver(fitWatch).observe(document.querySelector('.clockwrap'));
  tickClock(); tickDates(); tickRamadan(); buildToday();
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  else if(CONFIG.panel !== 'shows') renderPanel(false);   // its own data arrives with prayers, weather, matches
  loadPrayers(); loadMatches(); loadToday(); if(CONFIG.panel === 'shows') loadWeek(); loadWeather();
  applyNight(); pixelShift();

  setInterval(tickClock, 1000);
  setInterval(renderMessage,1000);
  setInterval(() => showAlerts(true), 7000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickRamadan(); if(CONFIG.panel === 'prayers') renderPanel(false); }, 15000);
  setInterval(() => renderMatches(false), 60000);
  setInterval(() => renderMatches(true), CONFIG.matchPageMs);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadMatches, 30*60*1000);
  setInterval(loadToday, 10*60*1000);   // today's games; their live scores every 60 s (refreshLive)
  setInterval(refreshLive, 60*1000);
  loadControl(); setInterval(loadControl, 10*1000);
  if(CONFIG.panel === 'shows') setInterval(loadWeek, 6*3600*1000);
  setInterval(loadWeather, 30*60*1000);
  setInterval(()=>{
    if(CONFIG.panel === 'shows' && WEEK_POOL.length > WEEK_ROWS) WEEK_PAGE++;   // the next five when its card comes round
  }, 25*1000);
  setInterval(applyNight, 60*1000);
  setInterval(() => { tickRamadan(); tickFamily(); tickCountdowns(); }, 1000);   // occasions turn every 15 s; countdowns by the second
  setInterval(() => loadSeries(true), 3*3600000);   // new episodes as they air
  setInterval(() => { autoQuran(); }, 60*1000); setTimeout(autoQuran, 8000);
  setInterval(matchMoments, 15*1000); setTimeout(matchMoments, 20000);
  setInterval(taskMoments, 15*1000);
  setTimeout(actx, 3000);   // the sound system ready before the first chime or whistle (it starts slowly)
  setInterval(rotateScreens, 15*1000);
  window.switchScreen = switchScreen;   // the remote's left and right, from the app
  if(ROTATES()){ const next = () => setTimeout(() => { turnCard(); next(); }, cardMs()); next(); }
  setInterval(() => {   // the followed teams' card: next page every 10 s
    if(MATCH_PAGES > 1 && document.getElementById('week-hd').textContent === PANEL_TITLE.matches){ MATCH_CARD_PAGE++; renderPanel(false); }
  }, 10000);
  setInterval(loadTeamFixtures, 6*3600000);   // the first run follows today's games (loadToday)
  setInterval(pixelShift, 4*60*1000);
  let lastDay = IDF('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  setInterval(()=>{
    const d = IDF('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
    if(d !== lastDay){ lastDay = d; loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadMatches(); loadToday(); if(CONFIG.panel === 'shows') loadWeek(); loadWeather(); renderPanel(false); }
  }, 60*1000);
}

// The launcher's card: the chosen panel only, refreshed like on the screensaver, nothing else loaded.
function bootWidget(){
  document.documentElement.classList.add('widget');
  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const P = CONFIG.panel;
  if(P === 'shows'){ loadWeek(); setInterval(loadWeek, 6*3600*1000); }
  else renderPanel(false);
  if(P === 'prayers' || P === 'home'){ loadPrayers(); setInterval(loadPrayers, 6*3600*1000); setInterval(() => renderPanel(false), 15000); }
  if(P === 'forecast'){ loadWeather(); setInterval(loadWeather, 30*60*1000); }
  if(P === 'matches'){ loadMatches(); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); }
  setInterval(() => {
    if(P === 'shows' && WEEK_POOL.length > WEEK_ROWS){ WEEK_PAGE++; renderWeekPage(true); }
    if(P === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(P === 'prayers') loadPrayers(); renderPanel(false); } }, 60*1000);
  reveal();
}

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();navigateCard(e.key==='ArrowLeft'?1:-1);}
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
